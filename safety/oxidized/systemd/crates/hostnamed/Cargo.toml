[package]
name = "systemd-hostnamed"
version = "0.1.0"
authors = ["Niclas Overby <niclas@overby.me>"]
edition = "2024"

[[bin]]
name = "systemd-hostnamed"
path = "src/main.rs"

[dependencies]
libc = "0.2"
log = "0.4"
nix = { version = "0.31", features = [
  "feature",
  "hostname",
  "process",
  "signal",
] }
zbus = "5"

[dev-dependencies]
tempfile = "3"
