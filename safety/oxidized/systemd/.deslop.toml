# deslop configuration for rust-systemd, a from-scratch systemd
# reimplementation (~60 crates: PID 1, journald, udevd, networkd, logind,
# homed and the rest of the daemon/tool surface).
#
# systemd is inherently a low-level project: it wraps raw syscalls and FFI
# (unsafe blocks, pointer casts, fn-pointer signal handlers, narrowing casts
# to kernel int widths), parses kernel/procfs/sysfs and unit files line by
# line into memory, holds process-global and daemon-lifetime state, passes
# credentials and secrets as plain strings the way PAM/homed do, and mirrors
# upstream systemd's monolithic module layout and naming. deslop's
# best-practice heuristics fire on all of that wholesale. Every rule listed
# below was observed firing on this tree; they are disabled so deslop does
# not drown real signal. Correctness is guarded instead by clippy
# (-D warnings) and the 400+ upstream integration tests.
disabled_rules = [
  "comment_style_tutorial",
  "expect_in_non_test_code",
  "generic_name",
  "hallucinated_import_call",
  "hallucinated_local_call",
  "hardcoded_secret",
  "overlong_name",
  "panic_macro_leftover",
  "rust_aos_hot_path",
  "rust_async_blocking_drop",
  "rust_async_lock_order_cycle",
  "rust_blocking_drop",
  "rust_boolean_state_machine",
  "rust_borrowed_pathbuf_api",
  "rust_borrowed_string_api",
