[package]
name = "cementite"
version.workspace = true
edition.workspace = true
description = "Fe-C runtime: allocation table, capability checks, quarantining allocator, libc interposition"
repository.workspace = true
license.workspace = true

[[bench]]
harness = false
name = "root_resolve"

# No runtime dependencies: cementite links into every instrumented binary,
# so it must not drag in crates (rustix/libc/bitflags) whose versions can't
# be reconciled across separate cargo build graphs. The metadata backend
# uses a raw mmap syscall (src/sys.rs).

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = [
  "cargo_bench_support",
] }

# No build dependencies either (invariant I11): build.rs invokes `cc`/`ar`
# directly to compile tests/harness.c under the `interpose` feature, so a
# crate that installs FecAlloc pulls in no C-toolchain crate (nor its build
# script) that the whole-graph instrumenter would fail to link.

[features]
# libc allocator interposition (Task A4). Off by default: the #[no_mangle]
# malloc/free overrides must not be linked into a build that also uses
# FecAlloc as the #[global_allocator], or Rust allocations register twice.
interpose = []
