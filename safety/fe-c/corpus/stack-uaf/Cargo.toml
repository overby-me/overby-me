# Stack use-after-scope-exit reproducer (Task B5, invariant I8). A pointer
# to a stack local escapes its frame (stashed in a static, the same laundering
# the rusqlite-0128 closure does across FFI); after the frame returns, the
# stale pointer is dereferenced. The scope hooks poison the region at frame
# teardown, so the access traps as UseAfterScopeExit naming the dead scope.
#
# Its own workspace. cementite is a normal path dependency (this leaf binary
# installs FecAlloc, a Rust type); the injected checks are symbol-level and
# add no edge (A4b / I11).
[package]
name = "stack-uaf"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "stack-uaf"
path = "src/main.rs"

[dependencies]
cementite = { path = "../../crates/cementite" }
