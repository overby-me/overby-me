[package]
name = "ffi-escape"
version = "0.0.0"
edition = "2021"
publish = false

# corpus-ffi-escape (Task B5, I9 / trace F6): the cross-FFI stack
# use-after-scope reproducer. A stack borrow escapes out to C via an
# extern-C registration call and is dereferenced when C re-enters Rust
# later. Its own workspace. cementite is a path dependency (this leaf binary
# installs FecAlloc); the injected checks are symbol-level (A4b / I11). The
# fe-c-ffi-escape check builds it with FEC_INSTRUMENT_ONLY=ffi_escape and
# asserts it aborts UseAfterScopeExit naming the dead stack scope.
[workspace]

[[bin]]
name = "ffi-escape"
path = "src/main.rs"

[dependencies]
cementite = { path = "../../crates/cementite" }
