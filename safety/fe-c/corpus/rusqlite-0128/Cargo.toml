[package]
name = "rusqlite-0128"
version = "0.0.0"
edition = "2021"
publish = false

# corpus-rusqlite-0128 (Task B5, the real CVE): RUSTSEC-2021-0128. rusqlite's
# create_scalar_function had a too-relaxed lifetime bound, so a closure
# capturing a stack borrow could be registered with SQLite, outlive the frame,
# and be invoked later — reading a dropped stack local through a safe
# reference. This is the first corpus entry pulling real third-party C
# (bundled libsqlite3-sys compiles SQLite), the mixed-language build smoke
# test. cementite is a path dependency (this leaf binary installs FecAlloc);
# the injected checks are symbol-level (A4b / I11).
#
# rusqlite 0.25.3 is yanked (that is what this advisory did), so its lock entry
# is hand-added; the rest of the tree resolves normally and is vendored by the
# fe-c-rusqlite-0128 check. Built under FEC_MODE=through: the closure reads the
# dead local through a *safe* reference, which only through mode checks.
[workspace]

[[bin]]
name = "rusqlite-0128"
path = "src/main.rs"

[dependencies]
cementite = { path = "../../crates/cementite" }
rusqlite = { version = "=0.25.3", features = ["bundled", "functions"] }
