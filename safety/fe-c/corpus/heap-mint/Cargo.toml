[package]
name = "heap-mint"
version = "0.0.0"
edition = "2021"
publish = false

# corpus-heap-mint (trace -0130 debuggability): a heap Box is freed while a
# field reference minted into it is still held, and the value is read through
# the dangling reference. Both modes abort UseAfterFree; because the mint
# (`&(*p).b`) is in this instrumented binary, the report names `minted_at`
# (where the reference was born), and case also names `read_at`. Its own
# workspace. cementite is a path dependency (this leaf binary installs FecAlloc,
# which tracks the Box allocation); the injected checks are symbol-level
# (A4b / I11).
[workspace]

[[bin]]
name = "heap-mint"
path = "src/main.rs"

[dependencies]
cementite = { path = "../../crates/cementite" }
