[package]
name = "toodee-0028"
version = "0.0.0"
edition = "2021"
publish = false

# corpus-toodee-0028 (RUSTSEC-2021-0028 / CVE-2021-28028): an out-of-bounds
# write. toodee 0.2.0's `insert_row` reserves space based on the iterator's
# `ExactSizeIterator::len()`, then `ptr::write`s the *actual* items it yields. A
# lying iterator that under-reports its length writes past the reserved Vec
# buffer. Vec-backed (FecAlloc tracks it); the OOB `ptr::write` is caught by the
# write-call extent check, resolved from the `as_mut_ptr` root. Both modes abort.
[workspace]

[[bin]]
name = "toodee-0028"
path = "src/main.rs"

[dependencies]
cementite = { path = "../../crates/cementite" }
toodee = "=0.2.0"
