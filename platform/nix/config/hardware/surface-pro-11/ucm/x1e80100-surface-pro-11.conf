
# Microsoft Surface Pro 11 (board "Denali"): 2x WSA8845 | 2x DMIC | no headset,
# no DisplayPort audio.
#
# Appended to alsa-ucm-conf's own Qualcomm/x1e80100/x1e80100.conf, which is
# where UCM picks an x1e80100 board out of DMI, and which defines the
# ${var:DMI_info} read below.  Appending rather than replacing keeps whatever
# boards alsa-ucm-conf adds after this was written.
#
# The other probe path, a conf.d/x1e80100/${CardLongName}.conf that would need
# no DMI match at all, is not usable: ASoC overwrites long_name with a
# DMI-derived string whenever dmi_available, so the card's long name is not the
# devicetree model.
# Loose between "Pro" and "11th" on purpose.  The board name carries the model
# variant, so the 5G machine this was brought up on reads
#
#   Microsoft Corporation-Surface-Microsoft Surface Pro with 5G, 11th Edition
#
# where the Wi-Fi-only one reads "Microsoft Surface Pro, 11th Edition".  Both are
# Denali with the same two amplifiers.
If.SURFACEPro11 {
	Condition {
		Type RegexMatch
		String "${var:DMI_info}"
		Regex "Microsoft Corporation.*Surface.*Microsoft Surface Pro.*11th Edition"
	}
	True.Include.sp11.File "/Qualcomm/x1e80100/MICROSOFT-Surface-Pro-11.conf"
}
