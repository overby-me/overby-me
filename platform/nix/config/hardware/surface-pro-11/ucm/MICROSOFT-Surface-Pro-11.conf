# Surface Pro 11 (Snapdragon X Elite, board "Denali").
#
# Vendored from ooaklee/linux-surface-pro-11-oe, payload/audio/, which is where
# these profiles were derived and tested.  alsa-ucm-conf's own x1e80100 directory
# covers the CRD, the Dells, the Lenovos and the Surface Pro 12in, but not this
# board.
#
# Unlike its Surface Pro 12in neighbour, this does not include
# /codecs/qcom-lpass/wsa-macro/init.conf: that sequence writes unprefixed control
# names and the value 84, where this card exposes prefixed names that the machine
# driver caps at 81.  The BootSequence below is the half of it that applies.

Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/x1e80100/Surface11-HiFi.conf"
	Comment "HiFi quality Music."
}

BootSequence [
	cset "name='WSA WSA_RX0 Digital Volume' 81"
	cset "name='WSA WSA_RX1 Digital Volume' 81"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wsa-init.File "/codecs/wsa884x/two-speakers/init.conf"
