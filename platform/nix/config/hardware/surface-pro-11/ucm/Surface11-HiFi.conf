# Surface Pro 11 HiFi verb: two WSA8845 amplifiers on SoundWire, two far-field
# DMICs on the VA macro.  Vendored from ooaklee/linux-surface-pro-11-oe,
# payload/audio/Surface11-HiFi.conf.
#
# No headset and no DisplayPort audio, because mainline's Denali devicetree
# declares only the wsa-dai-link and va-dai-link.  The topology does carry
# RX_CODEC_DMA_RX_0 and DISPLAY_PORT_RX_0-7, so both could appear here without
# needing a new one.
#
# Do not reintroduce the Wsa2Speaker* sequences an earlier revision had.  This
# card has one WSA macro, so UCM aborts on the missing WSA2 controls before
# exposing either device, and the card comes up with no Speaker and no Mic.

SectionVerb {
	EnableSequence [
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia4 Mixer VA_CODEC_DMA_TX_0' 1"

		# Complete the speaker transport before any client capability-probes
		# PCM1.  SectionDevice repeats this when Speaker is selected.
		cset "name='WSA WSA RX0 MUX' AIF1_PB"
		cset "name='WSA WSA RX1 MUX' AIF1_PB"
		cset "name='WSA WSA_RX0 INP0' RX0"
		cset "name='WSA WSA_RX1 INP0' RX1"
		cset "name='WSA WSA_COMP1 Switch' 1"
		cset "name='WSA WSA_COMP2 Switch' 1"
		cset "name='WSA WSA_RX0 Digital Mute' 0"
		cset "name='WSA WSA_RX1 Digital Mute' 0"
		cset "name='WSA WSA_RX0 Digital Volume' 81"
		cset "name='WSA WSA_RX1 Digital Volume' 81"

		cset "name='SpkrLeft COMP Switch' 1"
		cset "name='SpkrLeft BOOST Switch' 1"
		cset "name='SpkrLeft DAC Switch' 1"
		cset "name='SpkrLeft PBR Switch' 1"
		cset "name='SpkrLeft VISENSE Switch' 0"
		cset "name='SpkrLeft WSA MODE' 0"
		cset "name='SpkrLeft PA Volume' 6"
		cset "name='SpkrRight COMP Switch' 1"
		cset "name='SpkrRight BOOST Switch' 1"
		cset "name='SpkrRight DAC Switch' 1"
		cset "name='SpkrRight PBR Switch' 1"
		cset "name='SpkrRight VISENSE Switch' 0"
		cset "name='SpkrRight WSA MODE' 0"
		cset "name='SpkrRight PA Volume' 6"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	# Not /codecs/wsa884x/two-speakers/EnableSeq.conf: that writes PA volume
	# 12, x1e80100.c limits both PA controls to 6, and the rejected write
	# aborts the sequence before it reaches the right amplifier.
	EnableSequence [
		cset "name='WSA WSA RX0 MUX' AIF1_PB"
		cset "name='WSA WSA RX1 MUX' AIF1_PB"
		cset "name='WSA WSA_RX0 INP0' RX0"
		cset "name='WSA WSA_RX1 INP0' RX1"
		cset "name='WSA WSA_COMP1 Switch' 1"
		cset "name='WSA WSA_COMP2 Switch' 1"
		cset "name='WSA WSA_RX0 Digital Mute' 0"
		cset "name='WSA WSA_RX1 Digital Mute' 0"

		cset "name='SpkrLeft COMP Switch' 1"
		cset "name='SpkrLeft BOOST Switch' 1"
		cset "name='SpkrLeft DAC Switch' 1"
		cset "name='SpkrLeft PBR Switch' 1"
		cset "name='SpkrLeft VISENSE Switch' 0"
		cset "name='SpkrLeft WSA MODE' 0"
		cset "name='SpkrLeft PA Volume' 6"

		cset "name='SpkrRight COMP Switch' 1"
		cset "name='SpkrRight BOOST Switch' 1"
		cset "name='SpkrRight DAC Switch' 1"
		cset "name='SpkrRight PBR Switch' 1"
		cset "name='SpkrRight VISENSE Switch' 0"
		cset "name='SpkrRight WSA MODE' 0"
		cset "name='SpkrRight PA Volume' 6"
	]

	DisableSequence [
		cset "name='WSA WSA_COMP1 Switch' 0"
		cset "name='WSA WSA_COMP2 Switch' 0"
		cset "name='WSA WSA_RX0 INP0' ZERO"
		cset "name='WSA WSA_RX1 INP0' ZERO"
		cset "name='WSA WSA RX0 MUX' ZERO"
		cset "name='WSA WSA RX1 MUX' ZERO"

		cset "name='SpkrLeft COMP Switch' 0"
		cset "name='SpkrLeft BOOST Switch' 0"
		cset "name='SpkrLeft DAC Switch' 0"
		cset "name='SpkrLeft PBR Switch' 0"
		cset "name='SpkrLeft VISENSE Switch' 0"
		cset "name='SpkrRight COMP Switch' 0"
		cset "name='SpkrRight BOOST Switch' 0"
		cset "name='SpkrRight DAC Switch' 0"
		cset "name='SpkrRight PBR Switch' 0"
		cset "name='SpkrRight VISENSE Switch' 0"
	]

	Value {
		PlaybackChannels 4
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "Speakers"
	}
}

SectionDevice."Mic" {
	Comment "Internal microphones"

	Include.vadm0d.File "/codecs/qcom-lpass/va-macro/DMIC0DisableSeq.conf"
	Include.vadm1d.File "/codecs/qcom-lpass/va-macro/DMIC1DisableSeq.conf"

	# The shared enable sequences select 100 (+16 dB), which clips these
	# microphones into full-scale.  Same routing, unity gain (84 = 0 dB).
	EnableSequence [
		cset "name='VA DEC0 MUX' VA_DMIC"
		cset "name='VA DMIC MUX0' DMIC0"
		cset "name='VA_AIF1_CAP Mixer DEC0' 1"
		cset "name='VA_DEC0 Volume' 84"
		cset "name='VA DEC1 MUX' VA_DMIC"
		cset "name='VA DMIC MUX1' DMIC1"
		cset "name='VA_AIF1_CAP Mixer DEC1' 1"
		cset "name='VA_DEC1 Volume' 84"
	]

	Value {
		CaptureChannels 2
		CapturePriority 100
		CapturePCM "hw:${CardId},3"
	}
}
