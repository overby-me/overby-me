# What secrets exist, never their values. Providers hold those; per-host
# profiles say which are required where. The five here are the single-line
# migrations from agenix; the multiline ones (resolved conf, wifi
# nmconnection, ssh identities, phone host key) stay on agenix until a
# representation is chosen - a dotenv blob is no home for a PEM key.

[project]
name = "nix-config"

[profiles.default]
LLM_BACKEND = { description = "ironclaw LLM backend selector", required = false }
NEARAI_API_KEY = { description = "ironclaw NEAR AI key", required = false }
SEARX_SECRET_KEY = { description = "searxng server secret", required = false }
SPINDLE_TOKEN = { description = "spindle CI token for the knot", required = false }
STALWART_ADMIN_PASSWORD = { description = "stalwart mail admin password", required = false }

[profiles.home]
LLM_BACKEND = { required = true }
NEARAI_API_KEY = { required = true }
SEARX_SECRET_KEY = { required = true }
SPINDLE_TOKEN = { required = true }
STALWART_ADMIN_PASSWORD = { required = true }
