# What secrets exist, never their values. Providers hold those; per-host
# profiles say which are required where. Multiline files ride as base64
# values, decoded by the module's `encoding` option at materialise time.
# The phone host key is not declared: it bootstraps the image build by
# hand (see phone.nix) and its .age file remains as the manual backup.

[project]
name = "nix-config"
revision = "1.0"

[profiles.default]
LLM_BACKEND = { description = "ironclaw LLM backend selector", required = false }
NEARAI_API_KEY = { description = "ironclaw NEAR AI key", required = false }
SEARX_SECRET_KEY = { description = "searxng server secret", required = false }
SPINDLE_TOKEN = { description = "spindle CI token for the knot", required = false }
STALWART_ADMIN_PASSWORD = { description = "stalwart mail admin password", required = false }
RESOLVED_SECRET_CONF = { description = "resolved.conf.d drop-in naming DoT upstreams, base64", required = false }
U2F_KEYS = { description = "pam_u2f authfile, base64", required = false }
WIFI_CONCERO_NMCONNECTION = { description = "NetworkManager profile for headless SSH, base64", required = false }
SSH_ID_ED25519 = { description = "user SSH key, materialised into ~/.ssh, base64", required = false }
SSH_ID_RSA = { description = "user SSH key, materialised into ~/.ssh, base64", required = false }

[profiles.gravitas]
U2F_KEYS = { required = true }
SSH_ID_ED25519 = { required = true }
SSH_ID_RSA = { required = true }

[profiles.phone]
WIFI_CONCERO_NMCONNECTION = { required = true }

[profiles.home]
LLM_BACKEND = { required = true }
SEARX_SECRET_KEY = { required = true }
SPINDLE_TOKEN = { required = true }
STALWART_ADMIN_PASSWORD = { required = true }
