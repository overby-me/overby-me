# deslop configuration for the H.264 decoder.
#
# A video decoder reads a bitstream defined field by field in a specification,
# so most of what deslop flags here follows from the format rather than from
# how the port was written.

disabled_rules = [
  # H.264 fields are fixed-width by definition: a syntax element is read as
  # so many bits and stored in the width the standard gives it. Casting at
  # those boundaries is the format, and clippy's cast_possible_truncation
  # covers the cases that are actually lossy.
  "rust_narrowing_numeric_cast",

  # Pixel and macroblock loops read the same struct fields every iteration
  # because that is what a decode loop does.
  "rust_aos_hot_path",

  # Decoder state is filled as the bitstream supplies it: a sequence parameter
  # set exists before the picture parameter set that refers to it, so the
  # struct is valid only once the headers it needs have been parsed.
  "rust_partial_init_escape",

  # `collect_warnings` and `deblock` mirror flags the caller sets once at
  # construction, not modes to be chosen per call.
  "rust_public_bool_parameter_api",

  # The crate root re-exports its own public types, which is the API.
  "rust_root_reexport_wall",

  # Frames are written to the output sink as they are decoded, which is the
  # point of a streaming decoder.
  "rust_unbuffered_file_writes",

  # Fields read only by a feature that is not wired up yet.
  "rust_broad_allow_dead_code",

  # `Frame`, `Plane` and the other names are the specification's own.
  "generic_name",
  "rust_domain_raw_primitive",

  # The doc comments deslop reads as tutorial narration are the tables from
  # the standard, reproduced so a reader can check the code against them.
  "comment_style_tutorial",
]
