# Run `touch .envrc && direnv export json` to apply changes to the repository.
accept = [200, 201, 202, 203, 204, 206, 207, 429, 403]
exclude_path = ["nix/devshell/modules/configs/lychee.toml"]
exclude = [
  '\$\{',
  "x-access-token",
  "%7B",
  # Raw `{...}` template placeholders in source (e.g. `.../profile/{handle}`)
  # are not real links; skip them like the `%7B`/`${` encoded forms above.
  '\{',
  "localhost",
  '127\.0\.0\.1',
  'host\.docker\.internal',
  "https://github.com/example/",
  "https://fuchsia.googlesource.com/",
  "https://xcancel.com/",
  "https://smokesignal.events/",
  "https://wiki.multimedia.cx/",
  "https://spindle.tangled.sh/",
  "https://cloudflare-dns.com/",
  "https://mail.overby.me/",
  "https://api.mistral.ai/",
  "https://api.tokenfactory.nebius.com/",
  "https://console.mistral.ai/",
  "https://startpage.com/",
  "https://x.com/",
  # Placeholder URLs in rust/curl comments and test fixtures: the literal
  # hosts "host"/"proxy.example", the literal port ":port", and ellipsis
  # paths are examples, not real links.
  "^https?://(user1@)?host(/|$)",
  'proxy\.example',
  ":port",
  "%E2%80%A6",
  # Scaleway Serverless Functions/Containers API endpoints (e.g. the wiki backend):
  # these serve specific routes and 404 on `/`, so they are not link-checkable.
  'functions\.fnc\.[a-z0-9-]+\.scw\.cloud',
  # WebPush service endpoints are opaque per-subscriber URLs, not documentation
  # links; they appear in the wiki's push code + SSRF-allowlist tests (push.rs).
  'fcm\.googleapis\.com',
  'push\.services\.mozilla\.com',
  'web\.push\.apple\.com',
  'notify\.windows\.com',
  # Private / link-local addresses used as SSRF-rejection test targets (e.g. the
  # cloud metadata service 169.254.169.254) and fake test endpoints — never real
  # links.
  '//(10|192\.168|169\.254)\.\d',
  "//ep/",
]
