# Run `touch .envrc && direnv export json` to apply changes to the repository.
accept = [200, 201, 202, 203, 204, 206, 207, 429, 403]
exclude_path = ["nix/devshell/modules/configs/lychee.toml"]
exclude = [
  '\$\{',
  "x-access-token",
  "%7B",
  # Raw `{...}` template placeholders in source (e.g. `.../profile/{handle}`)
  # are not real links; skip them like the `%7B`/`${` encoded forms above.
  '\{',
  "localhost",
  '127\.0\.0\.1',
  'host\.docker\.internal',
  "https://github.com/example/",
  "https://fuchsia.googlesource.com/",
  "https://xcancel.com/",
  "https://smokesignal.events/",
  "https://wiki.multimedia.cx/",
  "https://spindle.tangled.sh/",
  "https://cloudflare-dns.com/",
  "https://mail.overby.me/",
  "https://api.mistral.ai/",
  "https://api.tokenfactory.nebius.com/",
  "https://console.mistral.ai/",
  "https://startpage.com/",
  "https://x.com/",
]
