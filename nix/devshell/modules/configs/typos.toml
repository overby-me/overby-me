# Run `touch .envrc && direnv export json` to apply changes to the repository.

[default]
extend-ignore-re = [
  # Mesa OpenGL-over-Vulkan driver
  "Zink",
  "Automattic",
  "Tre",
  "tre",
  "Importd",
  "importd",
  "Localed",
  "Iinclude",
  "localed",
  "OIF",
  "oif",
  "GOST",
  "Gost",
  # GNU tar upstream test names (tests/extrac*.at in tar-1.35)
  "extrac[0-9]+",
  "extrac\\*",
  # XScreenSaver copyright headers and revision histories, transcribed verbatim
  # into the Rust ports in web/homepage/xscreensaver.
  "[Oo]rignal",
  # quickhull.c's own comments, kept with the code they explain.
  "ajacent",
  "approprate",
  "10ths",
  "chuncks",
  # The PDB file format really does spell its bond record CONECT; molecule.rs
  # names it in its doc comment and its parser.
  "CONECT",
  # rotator.c's own name for its wander function.
  "SINOID",
  "sinoid",
  "descrete",
  "resoources",
  "distrubtable",
  "unneccessary",
  "posibility",
  "algortim",
  "compilcated",
  "resouces",
  "maintainance",
  "knowlege",
  "splitted",
  "seperate",
  # vermiculate's built-in programs are strings of keystrokes, not prose.
  "baMn[0-9]+",
  # t3d is written in German; its function names are kept as upstream has them.
  "projektion",
  # Federico Mena Quintero, credited in distort's vortex formula.
  "Mena",
  # Tru64, Compaq's Unix for the Alpha, one of the machines bsod crashes.
  "Tru64",
  "tru64",
  # bsod transcribes each machine's message exactly, misspellings and all.
  "Chcek",
  "exectuion",
  "refert",
  "nedia",
  "overlayed",
  "Unrecongized",
  # The ransomware's misspellings are the joke: it cannot spell either.
  "encrupted",
  "theif",
  # SCSI state DATA_DNE and the IDE device /dev/hda1, from the same dumps.
  "DATA_DNE",
  "hda[0-9]*",
  # A register value in the HP-UX dump and a Windows build tag, not words.
  "4FD8EDE1",
  "x86fre",
  # Hexadecimal addresses in the crash dumps bsod transcribes: 28BA568C and
  # the like, where the checker reads BA as a misspelling.
  "\\b[0-9A-F]{8}\\b",
]

[default.extend-words]
# In the copyright header of hacks/glx/flyingtoasters.c, which is kept
# verbatim: "the wide wonderful workd of OpenGL".
workd = "workd"
# The fictional menu of the Gibson, transcribed verbatim from
# hacks/glx/gibson.c, spelling and all.
QUANTATIVE = "QUANTATIVE"
FORCASTS = "FORCASTS"
# The author of hacks/glx/gflux.c is Josiah Pease.
Pease = "Pease"
# lod = level of detail, the mip level argument of GLSL's texelFetch. In the
# Shadertoy preamble transcribed from hacks/glx/xshadertoy.c.
lod = "lod"
# 6502 mnemonics and addressing modes, in the m6502 demo programs and in the
# opcode table of the assembler that reads them: CPY compares the Y register,
# INDX and INDY are indexed indirect addressing.
cpy = "cpy"
CPY = "CPY"
indx = "indx"
INDX = "INDX"
# ODF = OpenDocument Format (file-format abbreviation, Euro-Office core libs)
odf = "odf"
ODF = "ODF"
Odf = "Odf"
# fo = XSL-FO namespace prefix used throughout ODF (xmlns:fo, fo:font-size, ...)
fo = "fo"
# "mis-detects" — valid hyphenated prefix in euro-office PLAN.md
mis = "mis"
# Perl 5 test-suite filename (op/aassign.t — array assign)
aassign = "aassign"
# Perl 5 test-suite filename (op/wantarray_thr.t — threaded variant)
thr = "thr"
# Upstream API name from openssh-sftp-client crate
clonable = "clonable"
# GraphQL NOT IN operator
nin = "nin"
# Linux keycode ALS_TOGGLE (Ambient Light Sensor)
als = "als"
# Linux kernel bond option num_grat_arp (gratuitous ARP)
grat = "grat"
# GOST R 34.11-94 — Russian cryptographic hash standard (DNSSEC digest type 3)
gost = "gost"
# TPM2 spec type names (TPMS_ECC_PARMS, TPMS_RSA_PARMS, TPMS_KEYEDHASH_PARMS)
parms = "parms"
# H.264 unsigned exp-Golomb coding notation ue(v)
ue = "ue"
# Rust flate2 crate (DEFLATE/gzip codec)
flate = "flate"
# Bash test operator -ot (older than)
ot = "ot"
# BRE = Basic Regular Expression (regex standard term)
bre = "bre"
# Rela = ELF relocation entry type (SHT_RELA, Elf64_Rela)
rela = "rela"
# Siz = ELF readelf output abbreviation (FileSiz, MemSiz)
Siz = "Siz"
# GIR = GObject Introspection Repository (GNOME build tool)
gir = "gir"
# restat = ninja build system keyword (re-stat output files)
restat = "restat"
# DWARF attribute name DW_AT_endianity (DWARF 3 spec, dwarf.h:DW_AT_endianity = 0x65)
endianity = "endianity"
# DWARF section name .debug_aranges / .zdebug_aranges (Address Range Table)
aranges = "aranges"
# Nd = Unicode General Category for Decimal Digit (used in \p{Nd} regex props)
Nd = "Nd"
# controllen = libc msghdr field msg_controllen (sendmsg/recvmsg SCM_RIGHTS)
controllen = "controllen"
# CAF = Apple Core Audio Format (libsndfile container, rust/pipewire pw-cat)
caf = "caf"
CAF = "CAF"
# Alan W. Paeth, whose predictor is one of the five PNG scanline filters
paeth = "paeth"
Paeth = "Paeth"
# iy = the second image coordinate, paired with ix (xscreensaver ports)
iy = "iy"
# BLOAD = Apple DOS 3.3 command (Binary LOAD), typed by the apple2 saver
bload = "bload"
BLOAD = "BLOAD"
# rubik's -sizex/-sizey/-sizez options, which give the three edge lengths of
# an LxMxN cube; the resource name has to stay as upstream spells it.
sizez = "sizez"

[default.extend-identifiers]
# GNU tar upstream test names (tests/extrac*.at in tar-1.35) — not typos.
extrac01 = "extrac01"
extrac02 = "extrac02"
extrac03 = "extrac03"
extrac04 = "extrac04"
extrac05 = "extrac05"
extrac06 = "extrac06"
extrac07 = "extrac07"
extrac08 = "extrac08"
extrac09 = "extrac09"
extrac10 = "extrac10"
extrac11 = "extrac11"
extrac12 = "extrac12"
extrac13 = "extrac13"
extrac14 = "extrac14"
extrac15 = "extrac15"
extrac16 = "extrac16"
extrac17 = "extrac17"
extrac18 = "extrac18"
extrac19 = "extrac19"
extrac20 = "extrac20"
extrac21 = "extrac21"
extrac22 = "extrac22"
extrac23 = "extrac23"
extrac24 = "extrac24"
extrac25 = "extrac25"

[files]
extend-exclude = [
  # Euro-Office upstream patches (verbatim upstream code, incl. its own typos
  # like BUIDLER in build_3rdparty.py context lines).
  "pkgs/euro-office/patches/*",
  "web/wiki/src/i18n.rs",
  "secrets/*.age",
  # Upstream compiler code with assembly mnemonics and domain-specific abbreviations
  "rust/gcc/src/",
  "rust/gcc/include/",
  # Auto-generated bash 5.3 help text (upstream wording triggers false positives)
  "rust/bash/src/builtins/help_data.rs",
  # Registry index snapshot data (JSON lines fetched from index.crates.io);
  # contains target names like target_os = "nto" that look like typos
  "nix/lib/cargo/index/",
  "nix/lib/cargo/tests/fixtures/index/",
  # The Shadertoy programs, vendored verbatim from XScreenSaver. They are
  # shader source, and their local names are short and mathematical (ba, pa,
  # fre, lod, aas), so nearly every one reads as a misspelling.
  "web/homepage/xscreensaver/glsl/",
  # Likewise the 6502 demo programs, which are assembly listings.
  "web/homepage/xscreensaver/images/m6502/",
  # And the molecules, which are published crystallography files: the format
  # spells its bond records CONECT, and the chemistry is full of abbreviations.
  "web/homepage/xscreensaver/molecules/",
  # And the names of glsnake shapes, which come from the puzzle manual and
  # from the people who wrote the saver, spelling and all.
  "web/homepage/xscreensaver/src/hacks3d/glsnake_models.rs",
  # And endgame's games, whose moves are algebraic chess notation rather than
  # words: Ba6 is a bishop, Rhe1 a rook, Nf3 a knight.
  "web/homepage/xscreensaver/src/hacks3d/endgame_games.rs",
]
ignore-hidden = false
