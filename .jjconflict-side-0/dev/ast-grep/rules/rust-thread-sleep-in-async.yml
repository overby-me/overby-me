# std::thread::sleep inside an async fn parks the worker thread the future
# runs on - the executor-stall family rust-block-on-inside-async already
# covers, via the other common call. Measured at introduction: 197 sleep
# sites and 138 async files in this tree, intersection zero. Closures are
# excluded because spawn_blocking(|| thread::sleep(..)) is the correct escape.
id: rust-thread-sleep-in-async
language: rust
severity: warning
message: >-
  thread::sleep inside async blocks the runtime worker. Use
  tokio::time::sleep(...).await, or move the blocking section into
  spawn_blocking.
files:
  - "**/*.rs"
ignores:
  - "apps/wiki/vendor/**"
  - "safety/oxidized/**"
rule:
  any:
    - pattern: std::thread::sleep($$$A)
    - pattern: thread::sleep($$$A)
  inside:
    kind: function_item
    stopBy: end
    has: {kind: function_modifiers, regex: async}
  not:
    inside: {kind: closure_expression, stopBy: end}
