# An empty Err arm converts every failure - including the invariant
# violations - into nothing. A GUARDED empty arm is excluded: `Err(m) if
# classify(m) == Offline => {}` inside a retry loop is the arm doing its job
# (stay and retry), and the guard is the visible intent. `let _ =` is
# deliberately NOT matched: that
# spelling is the idiomatic, visible way to say "best effort, failure is
# fine" (shutdown sends, cleanup removes). The match-arm and if-let forms
# below carry no such signal; they usually mean the arm was stubbed.
id: rust-err-arm-swallowed
language: rust
severity: warning
message: >-
  This Err arm does nothing, so every failure is silently absorbed. Handle
  it, log it, or make the intent visible with `let _ = ...` at the call.
files:
  - "**/*.rs"
ignores:
  - "apps/wiki/vendor/**"
  - "safety/oxidized/**"
# The arm patterns need a context/selector: a bare `Err(_) => {}` is not an
# expression, so as a plain pattern it parses to nothing and the rule
# silently never fires - the test harness is what caught that.
rule:
  not:
    regex: ' if '
  any:
    - pattern:
        context: 'match x { Err($_E) => {} }'
        selector: match_arm
    - pattern:
        context: 'match x { Err(_) => {} }'
        selector: match_arm
    - pattern: if let Err($_E) = $E {}
    - pattern: if let Err(_) = $E {}
