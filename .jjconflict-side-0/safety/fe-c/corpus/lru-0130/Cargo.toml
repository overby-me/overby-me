[package]
name = "lru-0130"
version = "0.0.0"
edition = "2021"
publish = false

# corpus-lru-0130 (RUSTSEC-2021-0130): a use-after-free reachable from safe
# code. lru 0.6.6's iter() yields references with a too-detached lifetime, so
# the loop can pop (free) the node and then read through the dangling
# reference. Its own workspace. cementite is a path dependency (this leaf
# binary installs FecAlloc, which tracks the node allocations so the freed
# read resolves as dead); the injected checks are symbol-level (A4b / I11).
# The fe-c-lru-0130 check builds it with FEC_MODE=through and asserts it aborts
# UseAfterFree; the case-mode dealloc-reachable re-check (C2) is a follow-on.
[workspace]

[[bin]]
name = "lru-0130"
path = "src/main.rs"

[dependencies]
cementite = { path = "../../crates/cementite" }
lru = "=0.6.6"
