[package]
name = "randie"
version = "0.1.0"
edition = "2024"
description = "Randsim: the Randie navigation drone simulator, in Dioxus"

# One workspace over the three crates, so a single lock file covers the
# firmware, the world it flies in, and the page that draws them.
[workspace]
resolver = "3"
members = ["firmware", "sim"]

[dependencies]
dioxus = { version = "0.7.9", features = ["web"] }
gloo-timers = { version = "0.3", features = ["futures"] }
manganis = "0.7.9"
randie-firmware = { path = "firmware" }
randie-sim = { path = "sim" }
wasm-bindgen = "=0.2.121"
web-sys = { version = "0.3", features = [
  "AddEventListenerOptions",
  "CanvasRenderingContext2d",
  "Document",
  "DomRect",
  "Element",
  "Event",
  "EventTarget",
  "HtmlCanvasElement",
  "KeyboardEvent",
  "MouseEvent",
  "Performance",
  "WheelEvent",
  "Window",
  "console",
] }

[profile.release]
opt-level = "z"
# The firmware is full of narrow integers that the C let wrap. Every place the
# port means one to wrap says so, with `wrapping_*` or an `as` cast, so
# anything that overflows here is a bug worth stopping on rather than a wrap
# worth carrying on with. It is a simulator, not a render loop.
overflow-checks = true
lto = true
