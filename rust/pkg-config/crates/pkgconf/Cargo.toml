[package]
name = "pkgconf"
version = "0.1.0"
edition = "2024"
description = "A Rust rewrite and drop-in replacement for pkg-config/pkgconf"
readme = "../../README.md"
repository = "https://tangled.org/overby.me/overby.me/tree/main/rust-pkg-config"
license = "ISC"
keywords = ["build-tools", "pkg-config", "pkgconf"]
categories = ["command-line-utilities", "development-tools::build-utils"]

[[bin]]
name = "pkgconf"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libpkgconf = { path = "../libpkgconf" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
