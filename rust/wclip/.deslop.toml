# deslop configuration for rust-wclip, a Wayland clipboard tool.
#
# wclip speaks the Wayland wire protocol directly over the compositor socket,
# which inherently means raw libc FFI (sendmsg/recvmsg with SCM_RIGHTS, pipe2,
# fork), wire-format integer casts, and cross-module calls that single-file
# indexing misreads. Disable the rules that flag those intentional patterns.

disabled_rules = [
  # deslop indexes one file at a time; cross-module calls (e.g.
  # wire::Connection::connect, proto::setup, wire::Msg::new) appear as
  # "hallucinated" even though they compile fine.
  "hallucinated_import_call",

  # wclip has no async and no locks. The stdin/stdout handle locking is
  # sequential blocking I/O, not an async lock acquisition order.
  "rust_async_lock_order_cycle",

  # The FFI is thin wrappers around sendmsg/recvmsg/pipe2/fork; safety is
  # argued in the surrounding code, not per-block SAFETY comments (matching
  # the convention of the other rust/* packages).
  "unsafe_without_safety_comment",

  # sendmsg/recvmsg require casting &msghdr / cmsg buffers to raw pointers;
  # this is the only way to pass file descriptors over the socket.
  "rust_unsafe_raw_pointer_cast",

  # Wire-protocol fields are fixed-width (u16 length, u32 object id/opcode);
  # narrowing casts when serializing message headers are intentional.
  "rust_narrowing_numeric_cast",

  # The arg-parse loop and send_bytes' iovec setup access struct fields per
  # iteration; that is idiomatic, not an array-of-structs hot path.
  "rust_aos_hot_path",

  # State tracks protocol-negotiation flags (which data-control global was
  # bound, offer state) as booleans; an enum would not model concurrent flags.
  "rust_boolean_state_machine",

  # State::new fills its registry fields as globals are advertised during
  # roundtrip negotiation; the struct is fully valid before use.
  "rust_partial_init_escape",

  # The MIME-type -> data map is small and built from compositor input, not a
  # hot or adversarial path, so the default hasher is fine.
  "rust_hashmap_default_hasher",

  # Paste streams the selection to stdout in a read/write loop; buffering the
  # whole selection in memory first would defeat streaming large clipboards.
  "rust_unbuffered_file_writes",

  # The release profile intentionally uses LTO + strip for a small binary;
  # overflow checks are out of scope for a clipboard relay with no untrusted
  # arithmetic.
  "rust_release_profile_missing_overflow_checks",
]
