# deslop configuration for LLVM-rs.
#
# Rules are switched off here only with a written reason, the way rust/fe-c
# and rust/bash do it, so a disabled rule stays a recorded decision rather
# than a way to make a warning go away.

disabled_rules = [
  # A metadata name is lexed once where it is written, and there are a
  # handful in a module. `String::from_utf8` there is a correctness check
  # against a name upstream would refuse, not a cost in a hot path. The
  # heuristic cannot tell a lexer's one-shot decode from a per-byte one.
  "rust_utf8_validate_hot_path",

  # Arbitrary-precision arithmetic is width narrowing by construction: an
  # ApInt is a slice of u64 words, so every word access narrows a u128
  # product to u64, a bit index to a word index, or a bit width to a word
  # count. Each such cast is the algorithm, stated where it happens, and the
  # results are cross-checked against native u128 arithmetic over an operand
  # grid in apint.rs. Same call rust/fe-c makes for its packed capabilities.
  "rust_narrowing_numeric_cast",

  # LLVM's own vocabulary is long: "non-integral address space", "program
  # address space", "function pointer alignment". Shortening those names
  # would make this crate harder to check against LangRef, which is the only
  # specification we have.
  "overlong_name",

  # llvm-support is a facade over four independent modules and re-exports
  # their public types from the root on purpose: callers write
  # `llvm_support::ApInt`, not `llvm_support::apint::ApInt`, and the modules
  # stay separately readable. The root is the API, not a wall hiding
  # structure.
  "rust_root_reexport_wall",

  # The printer builds its output in a String through `write!`, which the
  # unbuffered-write heuristic reads as writing to a file inside a loop.
  # There is no file: the whole module is formatted into memory and returned,
  # which is exactly the buffering the rule asks for.
  "rust_unbuffered_file_writes",

  # A `Token` in the lexer and parser is a lexical token, not a credential,
  # so comparing one with `==` and printing one in a Debug impl are the parser
  # doing its job. Renaming the vocabulary of a compiler front end to satisfy
  # a secrets heuristic would make the code harder to check against LangRef.
  "rust_secret_equality_compare",
  "rust_debug_secret",

  # The symbol table a parser builds is keyed by names from the input, which
  # is exactly what upstream's StringMap is. A DoS-resistant hasher would cost
  # every lookup in the hottest map in the crate to defend against an attacker
  # who already controls the whole module being parsed.
  "rust_hashmap_default_hasher",

  # `vector_type(element, count, scalable)`, `struct_type(fields, packed)` and
  # `function_type(result, params, is_var_arg)` take the booleans LangRef
  # names as properties of those types. Wrapping each in a two-variant enum
  # would rename the specification without clarifying anything.
  "rust_public_bool_parameter_api",

  # deslop indexes one file at a time, so a call to a function declared in an
  # `extern` block, or to one in a sibling module, reads as unresolved even
  # though it compiles. Same call rust/fe-c and rust/bash make.
  "hallucinated_local_call",

  # The corpus seeds under corpus/rustc/src are compiler inputs, not library
  # code: each is a handful of lines whose only job is to make rustc emit a
  # particular shape of IR. Their `unsafe` is the point, and the heuristic
  # does not recognise the fn-level `pub unsafe fn` form even when the body
  # carries a SAFETY comment (the same call rust/fe-c makes).
  "unsafe_without_safety_comment",
  "rust_unsafe_raw_pointer_cast",

  # The `expect` calls in this project are invariant assertions in a compiler
  # data structure, not error handling: an arena slot that was removed, a slot
  # number the tracker must have assigned, a builder used with no insertion
  # point. Each is a caller bug rather than a runtime condition, and upstream
  # asserts on the same things. Real error paths return Result and carry a
  # source location. Same call rust/fe-c makes for its runtime.
  "expect_in_non_test_code",

  # `opt` reads a whole module into memory before parsing it, because that is
  # what parsing a module means, and it sets fields of its options struct in
  # the loop over argv, which is not a hot path by any definition.
  "rust_unbounded_read_to_string",
  "rust_aos_hot_path",

  # `parse_value`, `parse_type`, `constant`, `module`: the vocabulary reads
  # as generic because it is LangRef's, and renaming it to something more
  # specific would make the code harder to check against the specification
  # it implements.
  "generic_name",

  # `Lexer::new` fills every field it has; the heuristic reads the borrowed
  # input plus the running position as a half-built value.
  "rust_partial_init_escape",

  # A doc comment here records how a rule was measured against the assembler:
  # which module was written, what came back, and which probe designs were
  # wrong first. That is the only specification this crate has for the
  # behaviour, LangRef being silent on most of it, and a reader who has to
  # change a table needs the derivation more than they need brevity. The
  # heuristic reads any doc comment of that length as tutorial prose.
  "comment_style_tutorial",

  # `crates/llvm-ir/src/lib.rs` is sixty lines: a doc comment, the module
  # declarations and the re-exports callers use. The heuristic is measuring
  # the crate behind it rather than the file, and the split it asks for has
  # already happened into the modules that file names.
  "rust_oversized_module_file",
]
