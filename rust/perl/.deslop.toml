disabled_rules = [
  "hallucinated_import_call",
  "rust_hashmap_default_hasher",
  "rust_clone_heavy_state_in_loop",
  "rust_process_global_env_toggle",
  "rust_narrowing_numeric_cast",
  "rust_utf8_validate_hot_path",
  "rust_aos_hot_path",
  "rust_secret_equality_compare",
  "unwrap_in_non_test_code",
  "rust_release_profile_missing_overflow_checks",
  "rust_unbounded_read_to_string",
  "expect_in_non_test_code",
  "unreachable_macro_leftover",
  "rust_partial_init_escape",
  # Live-aliased globals (\@arr / \$var / \%h) intentionally store
  # state as Rc<RefCell<_>> so the ref and the slot share storage.
  "rust_rc_refcell_domain_model",
  # Some helper names are long-but-clear (descriptive intent over
  # brevity). Tradeoff acceptable for an interpreter glue layer.
  "overlong_name",
  # `libc::kill` is the only unsafe block; it's a thin syscall
  # wrapper with no invariants beyond what libc::kill itself documents.
  "unsafe_without_safety_comment",
  # `#[allow(dead_code)]` is on a single helper kept around for
  # future use; not a broad blanket.
  "rust_broad_allow_dead_code",
  # `.lines()` in `find_which_perl_require_line` scans a small
  # test-support file once at startup; not a hot path.
  "rust_lines_allocate_per_line",
  # `use bytes` byte-slicing intentionally reinterprets UTF-8 byte
  # sub-sequences; the resulting string is consumed by Perl-level code
  # that compares raw byte content, not Rust string operations.
  "rust_from_utf8_unchecked_boundary",
]
