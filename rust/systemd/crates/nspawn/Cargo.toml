[package]
name = "systemd-nspawn"
version = "0.1.0"
authors = ["Niclas Overby <niclas@overby.me>"]
edition = "2024"

[[bin]]
name = "systemd-nspawn"
path = "src/main.rs"

[dependencies]
libc = "0.2"
log = "0.4"
nix = { version = "0.31", features = [
  "fs",
  "hostname",
  "mount",
  "process",
  "sched",
  "signal",
  "socket",
  "user",
] }

[dev-dependencies]
tempfile = "3"
