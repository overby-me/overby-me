[package]
name = "cementite"
version.workspace = true
edition.workspace = true
description = "Fe-C runtime: allocation table, capability checks, quarantining allocator, libc interposition"
repository.workspace = true
license.workspace = true

[[bench]]
harness = false
name = "root_resolve"

[dependencies]
rustix = { version = "1", default-features = false, features = ["mm", "std"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = [
  "cargo_bench_support",
] }

[build-dependencies]
# Compiles tests/harness.c only when the `interpose` feature is set (see
# build.rs); a normal build runs the script as a no-op.
cc = "1"

[features]
# libc allocator interposition (Task A4). Off by default: the #[no_mangle]
# malloc/free overrides must not be linked into a build that also uses
# FecAlloc as the #[global_allocator], or Rust allocations register twice.
interpose = []
