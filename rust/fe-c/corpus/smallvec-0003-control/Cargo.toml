[package]
name = "smallvec-0003-control"
version = "0.0.0"
edition = "2018"
publish = false

# corpus-smallvec-0003 control: the *patched* smallvec (1.6.1). The same
# program must run clean under instrumentation — a checker that aborts on
# everything proves nothing. See docs/traces/rustsec-2021-0003.md.
[workspace]

[[bin]]
name = "smallvec-0003-control"
path = "src/main.rs"

[dependencies]
cementite = { path = "../../crates/cementite" }
smallvec = "=1.6.1"
