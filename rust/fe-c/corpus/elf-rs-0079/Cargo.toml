# corpus-elf-rs-0079 (RUSTSEC-2022-0079): elf_rs 0.2.0 parses an ELF header and
# builds `from_raw_parts(content.as_ptr().add(sh_off), sh_num)` for the section
# header table, with `sh_off`/`sh_num` taken straight from the (attacker-
# controlled) header — no bounds validation. A crafted header with a huge
# section count yields a slice far past the input buffer; iterating it reads
# out of bounds (the advisory notes trivial SIGABRT/SEGV under fuzzing). The
# slice-constructor extent check (point 1) catches the lie at the from_raw_parts
# mint, in both modes. Its own workspace; cementite is a path dependency (the
# leaf binary installs FecAlloc, tracking the heap-allocated ELF buffer). The
# fe-c-elf-rs-0079 check builds it in both modes and asserts both abort
# OutOfBounds.
[workspace]

[package]
name = "elf-rs-0079"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
cementite = { path = "../../crates/cementite" }
elf_rs = "=0.2.0"

[[bin]]
name = "elf-rs-0079"
path = "src/main.rs"
