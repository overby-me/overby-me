[package]
name = "rust-curl"
version = "0.1.0"
edition = "2024"
description = "A curl-compatible HTTP client written in Rust"
license = "MIT"

[[bin]]
name = "curl"
path = "src/main.rs"

[dependencies]
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
webpki-roots = "0.26"
flate2 = "1"
md-5 = "0.10"
sha2 = "0.10"
brotli-decompressor = "5"
idna = "1"
ruzstd = "0.8"
md4 = "0.10"
des = "0.8"
cipher = "0.4"

[profile.release]
lto = true
strip = true
