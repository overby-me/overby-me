[package]
name = "cardioid"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.9", features = ["web"] }
js-sys = "0.3"
wasm-bindgen = "=0.2.121"
web-sys = { version = "0.3", features = [
  "AddEventListenerOptions",
  "CanvasRenderingContext2d",
  "Document",
  "DomRect",
  "Element",
  "Event",
  "EventTarget",
  "History",
  "HtmlAnchorElement",
  "HtmlCanvasElement",
  "HtmlElement",
  "Location",
  "MouseEvent",
  "UrlSearchParams",
  "WheelEvent",
  "Window",
] }

[profile.release]
opt-level = "z"
lto = true
