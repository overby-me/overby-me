# deslop configuration for apps/wiki (the wiki Dioxus/WASM SPA).
#
# deslop's Rust rules are tuned for backend services. This crate is a browser
# single-page app: it talks to an NHost/Hasura GraphQL API over async reqwest,
# holds Dioxus signal guards for the span of a single expression, and persists
# its own session (including the user's access token) to localStorage on
# purpose. The rules disabled below flag those intentional patterns as defects.
# Genuine backend-style defects are not relevant to a WASM frontend.

disabled_rules = [
  # ── Dioxus macro / prelude resolution (single-file index) ─────────────
  # `use_signal`, `use_resource`, `spawn`, `use_navigator`, `rsx!` field
  # accessors, etc. come from `dioxus::prelude`; deslop indexes one file at a
  # time and cannot resolve them, nor cross-module `crate::graphql::*` calls.
  "hallucinated_local_call",
  "hallucinated_import_call",

  # ── Async patterns on the single wasm thread ──────────────────────────
  # Data loading awaits async reqwest calls (browser fetch); there is no
  # blocking I/O, no lock or pool permit held across the await, and futures
  # are not cancelled at a critical point. Signal `.read()` guards are dropped
  # at the end of the statement, before any `.await`.
  "rust_blocking_io_in_async",
  "rust_lock_across_await",
  "rust_async_hold_permit_across_await",
  "rust_async_spawn_cancel_at_await",
  "rust_large_future_stack",

  # ── Session token handling (frontend owns its own token) ──────────────
  # The Session/auth structs derive Debug for dev logging and are
  # (de)serialized to persist the user's own access token in localStorage.
  # Password-confirm fields in auth forms are compared with ==.
  "rust_debug_secret",
  "rust_serde_sensitive_serialize",
  "rust_serde_sensitive_deserialize",
  "rust_secret_equality_compare",

  # ── Domain modelling heuristics ───────────────────────────────────────
  # Node ids, keys and mime ids are carried as String to mirror the GraphQL
  # scalars; the default (empty, unauthenticated) Session is the intended
  # logged-out state, not an invalid domain object.
  "rust_domain_raw_primitive",
  "rust_domain_optional_secret_default",
  "rust_domain_default_produces_invalid",
  "rust_duplicate_bootstrap_sequence",

  # ── Infallible browser globals ────────────────────────────────────────
  # `web_sys::window()` / `Window::performance()` are always present in the
  # browser runtime this app targets, so unwrapping them cannot fail.
  "unwrap_in_non_test_code",

  # ── rsx rendering loops ───────────────────────────────────────────────
  # Iterating a small child/option/member list and reading a field per row
  # inside `rsx!` is the idiomatic Dioxus render pattern, not a hot data path.
  "rust_aos_hot_path",

  # ── Float→int countdown ───────────────────────────────────────────────
  # The speaker countdown floors an already-clamped, small f64 second value to
  # i64 for display; f64 has no `TryFrom<i64>` so `as` is the only option and
  # the narrowing is intentional and bounded.
  "rust_narrowing_numeric_cast",

  # ── Generated primitive re-exports ────────────────────────────────────
  # The dioxus-components primitives in `components/ui` each `pub use
  # component::*` from their generated mod.rs; that glob re-export is their
  # standard shape, not an accidental surface.
  "rust_pub_use_glob_surface",

  # ── GraphQL builder / port idioms ─────────────────────────────────────
  # cynic InputObjects and `*_bool_exp` values are built field by field with
  # `..Default::default()` (80+ sites), the idiomatic way to construct them,
  # not a partial-init escape. A few GraphQL helpers take a plain bool that maps
  # to the React app's own boolean prop or an inherent recursion marker
  # (create_poll's `hidden` hide-result flag, deep_copy_node's `is_root`); a
  # two-variant enum would only add ceremony. Ported functions also keep
  # detailed "why" doc comments cross-referencing the React component they
  # mirror, which is intentional and consistent across this port.
  "rust_partial_init_escape",
  "rust_public_bool_parameter_api",
  "comment_style_tutorial",

  # ── wiki-backend (atproto OAuth) ──────────────────────────────────────
  # The Scaleway function models opaque OAuth values (the CSRF `state`, the
  # authorization `code`, DID/handle strings) as `String` because that is
  # exactly what they are on the wire; they are not closed enumerations.
  "rust_stringly_typed_enum_boundary",
  # Query-string percent-decoding runs a couple of times per OAuth redirect, not
  # in any hot path, so a UTF-8 check there is fine.
  "rust_utf8_validate_hot_path",

  # ── Dioxus signal writes in async loops ───────────────────────────────
  # A `SIGNAL.write()` inside a coroutine's `while let Some(_) = rx.next().await`
  # loop (the window-resize -> WindowSizeClass bridge) is a reactive signal
  # write, not buffered file I/O; deslop's file-sink heuristic misreads `.write()`.
  "rust_unbuffered_file_writes",

  # ── Frontend-idiomatic false positives ────────────────────────────────
  # `segments.join("/")` builds a client-route / scroll-cache key string, not a
  # filesystem path; `main.rs` is the small (~200-line) module index, not an
  # oversized file; and `#[serde(default)]` on `User.avatar_url` / `AtprotoLink`
  # fields is intentional — sessions persisted before a field existed, and the
  # backend's "not linked" status legitimately omits handle/did.
  "rust_path_join_absolute",
  "rust_oversized_module_file",
  "rust_serde_default_on_required_field",

  # ── Backend crates (crates/appview + ballot-spec/store + spikes) ───────
  # deslop scans this whole directory (its .deslop.toml lives here), so the
  # AppView + ballot workspace is scanned under this config too. Its Rust rules
  # assume a general backend service; the rules below flag patterns that are
  # deliberate and reviewed in these crates (each verified a false positive, not
  # a real defect):
  #   - The AppView's firehose consumer is a deliberate fire-and-forget
  #     background task (main.rs spawns it without owning a JoinHandle).
  #   - The atproto OAuth wrapper (appview/oauth.rs, oauth-spike) models opaque
  #     wire values and surfaces atrium's `Box<dyn Error>` verbatim.
  #   - ballot-spec/ballot-store re-export the crypto + board types from their
  #     crate roots on purpose (that IS the crate's public surface).
  #   - PersistentBoard::cast/restore_entry mutate DB rows across an `.await`
  #     inside the kill-9-proven BEGIN IMMEDIATE transaction (atomicity is the
  #     DB's, not a broken in-memory invariant); ReplicaLog's two std Mutexes are
  #     only ever taken file→last_error (no inverse path, no cycle) and only in
  #     the SYNC `on_appended` (no await while held) — the one flagged site is a
  #     single-threaded test.
  #   - The WS relay uses `tokio::select!` (not `futures::select!`) over the
  #     cancel-safe `rx.recv()` / `socket.recv()`; re-creating them each loop is
  #     the idiomatic pattern (no fuse/pin needed).
  #   - The durability harness deliberately builds a Tokio runtime per kill-9
  #     iteration and `panic!`s on failure; CLI `main`s (migration-extractor,
  #     durability-harness) and the dagcbor spike `expect()` to fail fast, and
  #     the extractor reads a trusted, owner-provided local dump with
  #     `read_to_string`. rebuild_from_replica's `.lines()` is a rare recovery
  #     path, not hot.
  "rust_detached_spawn_without_handle",
  "rust_public_box_dyn_error",
  "rust_root_reexport_wall",
  "rust_async_invariant_broken_at_await",
  "rust_async_lock_order_cycle",
  "rust_async_std_mutex_await",
  "rust_async_missing_fuse_pin",
  "rust_async_recreate_future_in_select",
  "rust_tokio_runtime_built_per_call",
  "rust_runtime_builder_in_loop",
  "panic_macro_leftover",
  "expect_in_non_test_code",
  "rust_unbounded_read_to_string",
  "rust_lines_allocate_per_line",

  # ── Module organization (frontend + crates) ───────────────────────────
  # `mod.rs` files declare their submodules and re-export the module's public
  # items — the idiomatic Rust module-index shape (e.g. components/layout/mod.rs),
  # not an accidental catch-all.
  "rust_mod_rs_catchall",

  # ── Maps in a browser, not a server ───────────────────────────────────
  # The flagged sites are `HashMap::new()` in a `Default` impl (subscription.rs's
  # Registry, built once for the app's lifetime) and a style lookup assembled
  # while parsing one OpenDocument (odf.rs). Neither is a hot path. The rule
  # exists so a server does not hash attacker-chosen keys with SipHash in a
  # request loop; in a single-user WASM tab there is no such loop and no such
  # attacker, and the default hasher is the safer default to keep.
  "rust_hashmap_default_hasher",

  # The one flagged split is `split_payload` (feedback_app.rs), and its offset is
  # not external: it comes from `message.find(['{', '['])` on the very string
  # being split, so it is in bounds and on a character boundary by construction.
  # A guard there could not fail.
  "rust_split_at_unchecked_external_input",
]
