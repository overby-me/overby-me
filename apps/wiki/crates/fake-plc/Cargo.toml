[package]
name = "fake-plc"
version = "0.1.0"
edition = "2024"
publish = false

# A `did:plc` directory for a login rehearsed on one machine: a real PDS
# registers its accounts with a directory, and the public one is no place for
# made-up accounts. It keeps what it is told and checks none of it. Never
# deployed.
[dependencies]
axum = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
