[package]
name = "oauth-spike"
version = "0.1.0"
edition = "2021"

[dependencies]
atrium-identity = { version = "0.1.9", features = ["doh-handle-resolver"] }
# No default features: `default-client` is reqwest on OpenSSL (see src/lib.rs).
atrium-oauth = { version = "0.1.7", default-features = false }
atrium-xrpc = "0.12"
reqwest = { version = "0.12", default-features = false, features = [
  "gzip",
  "rustls-tls"
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
