[package]
name = "ballot-spec"
version = "0.1.0"
edition = "2024"

[dependencies]
# Provisional board-entry crypto encoding (base64url-unpadded) + serde for the
# wire shape.
base64 = "0.22"
blind-rsa-signatures = "0.17.2"
rand = "0.10.2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11.0"

[dev-dependencies]
proptest = "1.11.0"
