[package]
name = "ballot-spec"
version = "0.1.0"
edition = "2024"

[dependencies]
# Provisional board-entry crypto encoding (base64url-unpadded) + serde for the
# wire shape.
base64 = "0.22"
blind-rsa-signatures = "0.17.2"
rand = "0.10.2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11.0"

# For `custody`: what the board's custodian signs, and what anyone checking a
# board verifies. Optional, so that blinding and casting alone need one curve.
multibase = { version = "0.9", optional = true }
# No default features: p256's `std` turns on rand_core's getrandom 0.2, which
# does not build for wasm32-unknown-unknown, and nothing here draws randomness.
p256 = { version = "0.13", default-features = false, features = ["ecdsa"], optional = true }

[dev-dependencies]
proptest = "1.11.0"

[features]
custody = ["dep:multibase", "dep:p256"]
