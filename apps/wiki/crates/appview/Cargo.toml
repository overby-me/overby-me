[package]
name = "appview"
version = "0.1.0"
edition = "2024"

[lib]
name = "appview"
path = "src/lib.rs"

[[bin]]
name = "appview"
path = "src/main.rs"

[dependencies]
# Crash symbolication: resolve the wasm code offsets in a reported stack back to
# `file:line` against the DWARF sidecar the frontend build publishes. `addr2line`
# wraps `gimli` with the lookup logic; `object` parses the wasm container.
addr2line = "0.24"
# Background Web Push (RFC 8291 message encryption + RFC 8292 VAPID) is
# hand-rolled on RustCrypto primitives, since the `web-push` crate pulls
# libcurl/openssl: `aes-gcm` for the aes128gcm content encoding, `p256` for the
# ECDH agreement and the ES256 VAPID signature, `hkdf` for the key derivation.
aes-gcm = "0.10"
atrium-api = { version = "0.25.8", default-features = false, features = [
  "agent"
] }
atrium-common = "0.1.4"
atrium-identity = { version = "0.1.9", features = ["doh-handle-resolver"] }
# atproto OAuth: the thin atrium-oauth wrapper (proven in crates/oauth-spike),
# now with durable SQLite-backed state/session stores and the /callback slice.
# default-features off: `default-client` links OpenSSL; src/http.rs replaces it.
atrium-oauth = { version = "0.1.7", default-features = false }
# The AppView is a stateful persistent process (not scale-to-zero serverless):
# axum HTTP + WebSocket, a Turso datastore, an in-process broadcast channel.
axum = { version = "0.8", features = ["ws"] }
ballot-spec = { path = "../ballot-spec" }
# The durable ballot service: the public board (kill-9-proven atomic cast) + the
# private roster DDL, plus the off-node replica sink wired into this datastore.
ballot-store = { path = "../ballot-store" }
# Transferred backend infra: URL-safe base64 + CSRNG (util), and the state-cookie
# seal (HKDF-SHA256 key + XChaCha20-Poly1305) that survives the OAuth redirect.
base64 = "0.22"
# Reads the bulk member-import .xlsx here, so the xlsx/zip/inflate stack stays
# out of the wasm bundle every phone downloads.
calamine = "0.36"
chacha20poly1305 = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hkdf = "0.12"
# Signs the links that let an <img> or a document viewer fetch one blob.
hmac = "0.12"
http = "1"
object = { version = "0.36", default-features = false, features = [
  "read",
  "wasm"
] }
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
rand = "0.8"
# Same 0.12 line atrium resolves, so the two share one connection pool.
reqwest = { version = "0.12", default-features = false, features = [
  "gzip",
  "http2",
  "rustls-tls"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time"
] }
# The Jetstream firehose consumer: a WebSocket CLIENT (axum only serves WS) over
# the public wss endpoint, self-contained TLS via rustls + webpki roots.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# Streams a blob off disk as a response body.
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "env-filter",
  "fmt",
  "json"
] }
turso = "0.7"
wiki-domain-types = { path = "../domain-types" }
wiki-schema = { path = "../schema" }

[dev-dependencies]
# Builds the .xlsx a roster test parses. calamine's own zip, so nothing new.
zip = { version = "8", default-features = false }
