[package]
name = "spaces-spike"
version = "0.1.0"
edition = "2024"
publish = false

# A spike, like `oauth-spike` and `dagcbor-spike`: is a permissioned repo's signed
# commit (atproto spaces, proposal 0016) checkable from Rust, against what a real
# spaces PDS serves? Findings in FINDINGS.md. What holds here is what the
# AppView's syncer would be built on.
[dependencies]
base64 = "0.22"
blake3 = "1"
hmac = "0.12"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "sha256"] }
multibase = "0.9"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "sha256"] }
sha2 = "0.10"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
