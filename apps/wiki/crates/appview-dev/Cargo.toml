[package]
name = "appview-dev"
version = "0.1.0"
edition = "2024"

# A DEV tool, in no package and on no host: it hands out sessions for whatever
# DID it is asked to, which is what signing in exists to prevent.

[dependencies]
appview = { path = "../appview" }
axum = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
