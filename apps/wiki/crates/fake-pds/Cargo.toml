[package]
name = "fake-pds"
version = "0.1.0"
edition = "2024"
publish = false

# A PDS for tests only: the four repo calls the board's publisher makes and the
# one its mirror reads by, over records kept in memory. Never deployed.
[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
