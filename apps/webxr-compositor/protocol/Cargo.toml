[package]
name = "webxr-compositor-protocol"
version = "0.1.0"
edition = "2024"
description = "Wire protocol between the compositor host and its browser frontend"

[dependencies]
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
