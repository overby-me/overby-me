[package]
name = "webxr-compositor"
version = "0.1.0"
edition = "2024"
description = "Browser frontend of the WebXR Wayland compositor, in Dioxus"

# One workspace over the frontend and the wire protocol; the native host is
# its own workspace (host/) so smithay never enters the wasm dependency graph.
[workspace]
resolver = "3"
members = ["protocol"]

[dependencies]
dioxus = { version = "0.7.9", features = ["web"] }
futures-util = "0.3"
gloo-net = { version = "0.6", default-features = false, features = ["websocket"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
# Pinned to the devshell's wasm-bindgen-cli: dx runs that binary over this
# crate's output and the two must agree.
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "CanvasRenderingContext2d",
  "Clipboard",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "ImageData",
  "KeyboardEvent",
  "Location",
  "Navigator",
  "Window",
] }
webxr-compositor-protocol = { path = "protocol" }

[profile.release]
opt-level = "z"
lto = true
