# deslop configuration for apps/randie (a C firmware ported to no_std Rust, the
# world it is simulated in, and a Dioxus/WASM page that draws both).
#
# Two things here trip rules that are sound elsewhere. The firmware is embedded
# code for a board with 2 KiB of RAM, so it is made of `u8` map coordinates,
# `u16` sensor readings and a 32-bit fixed-point word, and narrowing between
# them is the subject rather than an accident. And the whole crate is a port, so
# it is heavily commented with what the C did and why a line differs -- which
# is the one thing a reader of a port needs and the one thing a
# tutorial-comment rule objects to.
#
# Genuine defects (unwrap in non-test code, and the rest) stay enabled.

disabled_rules = [
  # ── Cross-module / macro resolution false positives ───────────────────
  # deslop indexes one file at a time, so every use of a type from a sibling
  # module -- `Fix16` in `sonar.rs`, `Matrix` in `datafusion.rs`, `Vec2` in
  # `ray.rs` -- looks like a call into thin air.
  "hallucinated_import_call",
  # `use_signal`, `use_future` and `spawn` come from `dioxus::prelude`, which
  # single-file indexing cannot see either.
  "hallucinated_local_call",

  # ── Embedded arithmetic ───────────────────────────────────────────────
  # Map coordinates are `u8` because the map is 64 fields square, sensor
  # readings are `u16` because that is what the hardware sends, and the
  # fixed-point word is an `i32` that is deliberately truncated on the way to
  # an integer. Every narrowing in this crate is a documented one, and several
  # of them are the specific place the port tightened a bound the C did not
  # check.
  "rust_narrowing_numeric_cast",

  # ── Misread I/O ───────────────────────────────────────────────────────
  # `Map::write` writes a two-bit field into an array that stands in for the
  # board's EEPROM. There is no file and no syscall; writing one field at a
  # time in a loop is the whole interface.
  "rust_unbuffered_file_writes",
  # `str::lines` over a text map borrows from the string it was given. Nothing
  # is allocated per line.
  "rust_lines_allocate_per_line",

  # ── Shape of the port ─────────────────────────────────────────────────
  # The doc comments carry what the C did, what this does instead, and why.
  # That is what a port is for.
  "comment_style_tutorial",
  # `nav::State` is a port of a C bitfield of fifteen flags, and they are not
  # mutually exclusive: a drone can have a wall on its left, a window in front
  # and the ceiling above it at the same time. An enum would be wrong.
  "rust_boolean_state_machine",
  # The simulator crate re-exports the four types a caller needs -- `Block`,
  # `Drone`, `Ray`, `Vec2` -- from modules that are themselves public. It is a
  # short cut, not a wall.
  "rust_root_reexport_wall",
  # `Panel`'s `running` is a Dioxus prop reflecting whether the clock is going,
  # not a mode switch on a function.
  "rust_public_bool_parameter_api",
  # Matrix multiplication reads its operands' fields in the inner loop, as
  # matrix multiplication does; the matrices involved are 2x2.
  "rust_aos_hot_path",

  # ── Mounting a canvas ─────────────────────────────────────────────────
  # The canvas is set up in a `spawn` from `onmounted` because the element only
  # exists once mounted. It is single-threaded wasm doing DOM calls, so there
  # is no blocking work and nothing to cancel: the animation loop stops when
  # the canvas leaves the document.
  "rust_blocking_io_in_async",
  "rust_async_spawn_cancel_at_await",
]
