# deslop configuration for apps/homepage (Dioxus/WASM WebGL force-graph + a small
# axum backend).
#
# A Dioxus/WASM app that talks to WebGL directly inherently needs raw-memory
# views into the wasm heap, narrowing casts to GL integer widths, cross-module
# access to `static` graph data, and Dioxus hook/macro calls that single-file
# indexing cannot resolve. Rules that flag these patterns as defects are
# disabled below. Genuine defects (e.g. unwrap in non-test code) stay enabled.

disabled_rules = [
  # ── Cross-module / macro resolution false positives ───────────────────
  # `NODES`/`LINKS` are `static`s in `data.rs`; deslop indexes one file at a
  # time and reports `NODES.iter()` etc. as calls into an unindexed module.
  "hallucinated_import_call",
  # `use_signal`, `spawn`, and friends come from `dioxus::prelude`; the
  # single-file index has no local symbol for them.
  "hallucinated_local_call",

  # ── WebGL raw-memory interop ──────────────────────────────────────────
  # Uploading vertex data requires `Float32Array::view` / `from_raw_parts`
  # over the wasm heap. Each site is intentional and short-lived.
  "unsafe_without_safety_comment",
  "rust_unsafe_raw_pointer_cast",
  "rust_unsafe_from_raw_parts",

  # ── Numeric casts to GL widths ────────────────────────────────────────
  # Canvas sizes, vertex/index counts, and attribute locations are narrowed
  # to the i32/u32 widths the WebGL API expects.
  "rust_narrowing_numeric_cast",

  # ── Shared single-threaded state ──────────────────────────────────────
  # The WebGL texture cache is `Rc<RefCell<HashMap<..>>>` so the async image
  # onload closures and the render loop can share it on the single wasm
  # thread. That interior mutability is the intended design, and the default
  # hasher is fine for a couple dozen icon entries.
  "rust_pub_interior_mutability_field",
  "rust_rc_refcell_domain_model",
  "rust_hashmap_default_hasher",

  # ── Release profile ───────────────────────────────────────────────────
  # The wasm bundle is built with opt-level "z" + LTO for size; overflow
  # checks are intentionally left off (no arithmetic on untrusted input).
  "rust_release_profile_missing_overflow_checks",

  # ── Structure / naming ────────────────────────────────────────────────
  # `graph/mod.rs` is the module's component + render-loop hub by design.
  "rust_mod_rs_catchall",
  # `create_buffer` mirrors the WebGL call it wraps.
  "generic_name",
  # The cardioid page's `Settings` is a flat bag of simulation parameters
  # (radii, angular velocities, toggles) mirroring pysim's `settings` dict.
  # These values are inherently primitive and gain nothing from newtypes.
  "rust_domain_raw_primitive",

  # ── Performance heuristics that don't apply ───────────────────────────
  # The force simulation and renderer iterate node/link arrays accessing
  # several fields per element; that struct-of-arrays access is the point.
  "rust_aos_hot_path",

  # ── Backend ───────────────────────────────────────────────────────────
  # The RSS-proxy handler awaits a reqwest call; it holds no semaphore permit
  # or pooled guard across the await, so the heuristic is a false positive.
  "rust_async_hold_permit_across_await",

  # ── xscreensaver ports ────────────────────────────────────────────────
  # Upstream calls a screensaver a "hack" (`hacks/pong.c`, "the XScreenSaver
  # hacks"), so the word is all over the ports' doc comments and every one of
  # them trips the leftover-marker rule. Renaming the domain term to satisfy a
  # lint would make the ports harder to match against their originals.
  "hack_doc_comment_leftover",
  # The ports document how they differ from the C they came from, which is the
  # most useful thing their doc comments can say and reads as "tutorial style".
  "comment_style_tutorial",
  # `Opt { key, .. }` is a resource name and `Resources` maps names to values;
  # neither is a secret, but "key"/"value" reads as one to the heuristic.
  "rust_debug_secret",
  "rust_secret_equality_compare",
  # `make_color_ramp(.., closed_p)` and `make_random_colormap(.., bright_p)`
  # keep the parameter names and shapes of `utils/colors.c`. Introducing enums
  # would make the ports' call sites diverge from the originals for no gain.
  "rust_public_bool_parameter_api",
  # `runtime/mod.rs` is the module's hub by design, like `graph/mod.rs`: it is
  # the Screenhack contract plus the driver that every port is written against.
  "rust_oversized_module_file",
  # The query-string decoder runs once when a saver starts, not per frame.
  "rust_utf8_validate_hot_path",
  # The canvas is set up in a `spawn` from `onmounted` because the element only
  # exists once mounted. It is single-threaded wasm doing DOM calls, so there is
  # no blocking work and nothing to cancel: the loop stops when the canvas
  # leaves the document.
  "rust_blocking_io_in_async",
  "rust_async_spawn_cancel_at_await",
  # The rule fires per function, and the screensaver's settings effect is a
  # synchronous closure that happens to `spawn` a future. Its signal reads and
  # its `RefCell` borrows are each scoped to one statement, none of them
  # anywhere near the `await` inside the spawned block.
  "rust_lock_across_await",
  # `Source::from_query` returns the unit variant `Source::None` when there is
  # no `images` parameter to read. That is the answer, not a half-built value.
  "rust_partial_init_escape",
]
