[package]
name = "homepage"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.9", features = ["router", "web"] }
glam = "0.29"
js-sys = "0.3"
log = "0.4"
manganis = "0.7.9"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "0.4"
wasm-logger = "0.2"
web-sys = { version = "0.3", features = [
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "Element",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlImageElement",
  "Location",
  "MouseEvent",
  "Performance",
  "Response",
  "Url",
  "UrlSearchParams",
  "WebGlBuffer",
  "WebGlContextAttributes",
  "WebGlProgram",
  "WebGlRenderingContext",
  "WebGlShader",
  "WebGlTexture",
  "WebGlUniformLocation",
  "Window",
  "console",
] }

[profile.release]
opt-level = "z"
lto = true
