[package]
name = "ballot-store"
version = "0.1.0"
edition = "2024"

[dependencies]
# The ballot service's persistent layer: bind ballot-spec's pure Board + roster
# to a durable Turso store (the kill-9-proven atomic-cast transaction), and the
# org-authoritative eligibility/delegation/issuance half.
ballot-spec = { path = "../ballot-spec" }
turso = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# The lossless SQLite bridge: validate the ballot DDL on stock SQLite too.
rusqlite = { version = "0.37", features = ["bundled"] }
