[package]
name = "wiki-backend"
version = "0.1.0"
edition = "2021"

# Scaleway serverless function: the runtime calls `handle(req) -> response`.
[lib]
path = "src/handle.rs"

[dependencies]
axum = "0.8.6"
http = "1.3.1"
reqwest = { version = "0.12.24", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
