[package]
name = "wiki-backend"
version = "0.1.0"
edition = "2021"

# Scaleway serverless function: the runtime calls `handle(req) -> response`.
[lib]
path = "src/handle.rs"

[dependencies]
axum = "0.8.6"
http = "1.3.1"
reqwest = { version = "0.12.24", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# atproto OAuth (public client, PKCE + DPoP) needs URL-safe base64, SHA-256
# (PKCE challenge, JWK thumbprint, DPoP `ath`), HMAC (verify the HS256 NHost
# access token), P-256 ES256 signing (DPoP proofs), a CSRNG, and an AEAD to
# carry the ephemeral link state (incl. the DPoP private key) across the redirect.
base64 = "0.22"
chacha20poly1305 = "0.10"
hmac = "0.12"
p256 = { version = "0.13", features = ["ecdsa", "jwk"] }
rand = "0.8"
sha2 = "0.10"
