<!DOCTYPE html>
<html>
    <head>
        <title>RadikalWiki</title>
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta charset="UTF-8">
        <!--
          The boot screen, inline on purpose.

          Everything here has to work with NO stylesheet and NO wasm, because
          that is the state it exists to cover: the seconds between the browser
          having the document and the app being able to draw. Anything loaded
          from a file would arrive too late to help, so the colours are literals
          rather than tokens - they are the generated theme's own primary (the
          figure) and tertiary (the progress ring), light and dark, copied from
          assets/m3-theme.css. If that theme is ever reseeded these want changing
          with it.

          The figure is the Material 3 Expressive loading indicator, the same
          wavy ring the running app uses for every wait (.spinner in
          assets/style.css), so the first thing a reader sees and the thing they
          see for the rest of the session are one design and not two. The path is
          generated by scripts/gen-wave-ring.nu; the app takes it as a mask, this
          screen takes it as three real <path> elements, because here it also has
          to carry the download.
        -->
        <style>
            #boot {
                position: fixed;
                inset: 0;
                display: grid;
                place-items: center;
                background: #fbfdf7;
                z-index: 2147483000;
                transition: opacity 240ms ease;
            }
            #boot.is-done { opacity: 0; pointer-events: none; }

            /* One object doing both jobs: the ring is the shape being waited on,
               and the ring is where the download is reported. A separate bar
               under a separate figure would be two things to watch.

               Three copies of the one path. The track is always there; the chase
               is a fifth of it travelling round while nothing measurable is
               happening; the arc is the download itself, and it appears only
               once there is something true to say, because a cached bundle
               arrives in a single chunk and an arc that flashes full and
               vanishes says nothing.

               SVG rather than the mask the app uses, because a stroked path can
               be walked with a dash offset, which is what turns the same wave
               into a determinate indicator. */
            #boot-ring {
                width: 88px;
                height: 88px;
                /* Start at twelve o'clock; SVG angles begin at three. */
                transform: rotate(-90deg);
            }
            #boot-track,
            #boot-chase,
            #boot-arc {
                fill: none;
                stroke-width: 3.2;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            /* Hard-coded colours, like everything else here: the theme's
               variables arrive with the app, and this screen is what stands in
               for the app until they do. Two roles, two colours. The wave is the
               app's own primary, which says which app this is; the download arc
               is the accent (M3 tertiary, the Radikale magenta), which says how
               far in it is. */
            #boot-track { stroke: rgba(0, 109, 57, 0.16); }
            #boot-chase {
                stroke: #006d39;
                transition: opacity 200ms ease;
                /* A fifth of the ring, chasing round it. The numbers are the
                   path's own length, 130.96, which is exact because the path is
                   a polyline. Keep in step with WAVE_LEN below. */
                stroke-dasharray: 26.19 104.77;
                animation: boot-chase 1.4s linear infinite;
            }
            @keyframes boot-chase { to { stroke-dashoffset: -130.96; } }
            #boot-arc {
                stroke: #b51268;
                /* A full dash with a full offset draws nothing; the loader walks
                   the offset down to zero as the bytes arrive. */
                stroke-dasharray: 130.96;
                stroke-dashoffset: 130.96;
                transition: stroke-dashoffset 140ms linear;
            }
            /* Once bytes are being counted, the chase has nothing left to say. */
            #boot-ring.is-measuring #boot-chase { opacity: 0; }

            /* The app sets data-theme once it is running; before that the only
               thing to go on is what the device asks for. Both are honoured, so
               a dark-mode reader is not flashed a white screen. */
            @media (prefers-color-scheme: dark) {
                #boot { background: #191c19; }
                #boot-track { stroke: rgba(104, 221, 143, 0.20); }
                #boot-chase { stroke: #68dd8f; }
                #boot-arc { stroke: #ffb0cb; }
            }
            html[data-theme="dark"] #boot { background: #191c19; }
            html[data-theme="dark"] #boot-track { stroke: rgba(104, 221, 143, 0.20); }
            html[data-theme="dark"] #boot-chase { stroke: #68dd8f; }
            html[data-theme="dark"] #boot-arc { stroke: #ffb0cb; }
            html[data-theme="light"] #boot { background: #fbfdf7; }
            html[data-theme="light"] #boot-track { stroke: rgba(0, 109, 57, 0.16); }
            html[data-theme="light"] #boot-chase { stroke: #006d39; }
            html[data-theme="light"] #boot-arc { stroke: #b51268; }

            /* The chase is decoration and stops. The ARC keeps moving: it is
               information, and it only moves when bytes do. */
            @media (prefers-reduced-motion: reduce) {
                #boot-chase { animation: none; }
                #boot-arc { transition: none; }
            }
        </style>
    </head>
    <body>
        <div id="main"></div>
        <div id="boot" role="status" aria-label="Loading">

        <!--
          The reader's own choice of theme, applied before anything is drawn.
          `theme.rs` writes it to localStorage and sets the same attribute once
          the app is running, but that is seconds away; without this a reader who
          chose light on a dark device gets a dark boot screen and then a light
          app, which is the flash this whole file exists to avoid. Wrapped
          because storage can throw in a private window, and a boot screen is no
          place to be fussy.
        -->
        <script>
            try {
                var t = localStorage.getItem("wiki_theme");
                if (t === "light" || t === "dark") {
                    document.documentElement.setAttribute("data-theme", t);
                }
            } catch (e) {}
        </script>
        <!--
          Download progress for the wasm bundle, which is the wait this screen
          covers: a couple of megabytes over whatever connection the reader has.

          The size cannot be read off the response. The server sends the bundle
          gzipped and CHUNKED, so there is no `Content-Length` to divide by --
          and a stream reader counts DECOMPRESSED bytes anyway, which that header
          would not describe even when present. So the build writes the wasm's
          uncompressed byte count into the line below (scripts/inject-wasm-size.nu),
          and that is the denominator. Left at 0 the bar simply never appears,
          which is what a dev build gets and what an unpatched deploy would get.

          The response handed on to the loader is the ORIGINAL, untouched: only a
          `clone()` is read here. The generated glue calls
          `WebAssembly.instantiateStreaming` and RETHROWS if it fails on a
          correctly-typed response, so there is no fallback to be had -- handing
          it a reconstructed Response would be betting the whole app on an engine
          detail. A clone cannot cost anything but memory.
        -->
        <script>
            window.__WASM_BYTES__ = 0;
            (function () {
                var total = window.__WASM_BYTES__ | 0;
                if (!total || typeof window.fetch !== "function") return;

                // The length of the wave path #boot-arc's dash pattern is
                // measured in. Keep in step with the stylesheet above.
                var WAVE_LEN = 130.96;
                var seen = 0;
                var started = Date.now();
                var ring = null;
                var arc = null;

                function paint() {
                    if (ring === null) {
                        ring = document.getElementById("boot-ring");
                        arc = document.getElementById("boot-arc");
                        if (!ring || !arc) { ring = null; return; }
                    }
                    // Not before a quarter of a second: a cached bundle arrives
                    // in one chunk, and an arc that flashes full and disappears
                    // says nothing except that something flickered. Until then
                    // the ring keeps chasing, which is the honest report.
                    if (Date.now() - started <= 250) return;
                    var p = Math.min(seen / total, 1);
                    // `setAttribute` rather than `.className`: on an SVG element
                    // that property is a read-only SVGAnimatedString, and
                    // assigning a string to it silently does nothing.
                    ring.setAttribute("class", "is-measuring");
                    arc.style.strokeDashoffset = (WAVE_LEN * (1 - p)).toFixed(2);
                    ring.setAttribute("aria-valuenow", Math.round(p * 100));
                }

                function count(body) {
                    var reader = body.getReader();
                    (function pump() {
                        reader.read().then(function (r) {
                            if (r.done) return;
                            seen += r.value.length;
                            paint();
                            pump();
                        }, function () {});
                    })();
                }

                // Start again on ground the worker is not holding. Marked
                // first: if this reload lands on the same failure, the mark is
                // already set and the shell lets it fail visibly rather than
                // reloading forever.
                function recover(why) {
                    try {
                        if (sessionStorage.getItem("wiki_recovered")) return;
                        sessionStorage.setItem("wiki_recovered", why);
                    } catch (e) { return; }
                    var done = function () { location.reload(); };
                    var caches_gone = (window.caches && caches.keys)
                        ? caches.keys().then(function (keys) {
                            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                        }).catch(function () {})
                        : Promise.resolve();
                    var worker_gone = (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
                        ? navigator.serviceWorker.getRegistrations().then(function (rs) {
                            return Promise.all(rs.map(function (r) { return r.unregister(); }));
                        }).catch(function () {})
                        : Promise.resolve();
                    Promise.all([caches_gone, worker_gone]).then(done, done);
                }

                var original = window.fetch;
                window.fetch = function (input) {
                    // The loader passes whichever of the three the bundler felt
                    // like emitting -- a string, a `Request`, or a `URL`. A URL
                    // has no `.url`, and stringifies to its href.
                    var url = typeof input === "string"
                        ? input
                        : (input && input.url) || String(input || "");
                    var result = original.apply(this, arguments);
                    if (!/\.wasm($|\?)/.test(url)) return result;
                    // One bundle, one measurement; everything the app fetches
                    // afterwards goes straight through.
                    window.fetch = original;
                    return result.then(function (response) {
                        // A bundle that did not arrive, or arrived as something
                        // else. Reported from the hall as "Failed to load ...
                        // A ServiceWorker intercepted the request and
                        // encountered an unexpected error", after which the tab
                        // stayed broken through reload after reload -- because
                        // whatever the worker is holding under that URL is what
                        // it keeps handing back.
                        //
                        // The app cannot start from here and nothing it could
                        // say would help, so the shell clears the ground: drop
                        // every cache, let go of the worker, and load again.
                        // Once per tab, marked before the reload, so a site that
                        // is genuinely down cannot turn this into a loop.
                        var wasm = (response.headers.get("content-type") || "")
                            .indexOf("wasm") !== -1;
                        if (!response.ok || !wasm) recover("bad wasm response");
                        try {
                            if (response.ok && response.body) count(response.clone().body);
                        } catch (e) {}
                        return response;
                    }, function (err) {
                        recover("wasm fetch failed");
                        throw err;
                    });
                };
            })();
        </script>
        <script>
            // Hands a HEIC to the worker and gives back an object URL for a
            // JPEG the browser can draw (see assets/heic-worker.js).
            //
            // Here rather than in Rust because the worker, the request ids and
            // the promise that pairs them are all plain JS; the app calls this
            // and awaits it (components/loader.rs). If this is missing -- an
            // old shell still cached, say -- the caller falls back to decoding
            // on the main thread, which is slow but correct.
            (function () {
                var worker = null;
                var seq = 0;
                var pending = new Map();

                function settle(id, url) {
                    var resolve = pending.get(id);
                    if (!resolve) return;
                    pending.delete(id);
                    resolve(url);
                }

                window.heicDecode = function (bytes) {
                    return new Promise(function (resolve) {
                        if (!worker) {
                            // Started on first use, so a visitor who never meets
                            // a HEIC never fetches the decoder at all.
                            worker = new Worker("/heic-worker.js");
                            worker.onmessage = function (e) {
                                settle(e.data.id, e.data.blob ? URL.createObjectURL(e.data.blob) : null);
                            };
                            worker.onerror = function () {
                                // The worker is gone; nothing pending can ever
                                // be answered, so fail them all rather than
                                // leave the images spinning forever.
                                pending.forEach(function (r) { r(null); });
                                pending.clear();
                                worker = null;
                            };
                        }
                        var id = ++seq;
                        pending.set(id, resolve);
                        // A copy, because `bytes` is a view into the wasm heap:
                        // transferring it would detach the app's own memory, and
                        // not transferring it would copy anyway on the way out.
                        var copy = bytes.slice();
                        worker.postMessage({ id: id, bytes: copy }, [copy.buffer]);
                    });
                };
            })();
        </script>
