[package]
name = "wiki-dioxus"
version = "0.1.0"
edition = "2021"

[dependencies]
# (xlsx roster parsing moved to the backend to keep calamine/zip/inflate out of
# the wasm bundle — see nhost::parse_roster / backend roster.rs.)
console_error_panic_hook = "0.1"
cynic = { version = "3", features = ["http-reqwest"] }
dioxus = { version = "0.7.9" }
dioxus-icons = { version = "0.1.0", default-features = false }
# Pinned to an explicit rev so `cargo update` can't float it to HEAD (which would
# stale the Nix `outputHashes` FOD hash in default.nix and break the build).
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "bf007c15d0cf4d04d3181cc46cf12325aa773955", version = "0.0.1", default-features = false }
# StreamExt for the use_coroutine bridge that feeds window-resize widths into the
# adaptive WindowSizeClass signal from inside the Dioxus runtime.
# Office Open XML parsers (MIT, Yuki Yokotani) — github.com/yukiyokotani/office-open-xml-viewer
# Pinned to a rev like dioxus-primitives above, so `cargo update` cannot float
# it and stale the Nix outputHashes.
docx-parser = { git = "https://github.com/yukiyokotani/office-open-xml-viewer", rev = "d8c4b961adce0b90e43cbe7723a39f3f123b9e74", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
log = "0.4"
# Runtime Material Design 3 scheme generation from user-chosen seed colors (the
# same material-color-utilities engine as scripts/gen-theme.ts). default-features
# off keeps it no_std/wasm-friendly (drops ahash runtime-rng -> getrandom); libm
# supplies the float math std would otherwise provide.
material-colors = { version = "0.4", default-features = false, features = [
  "libm"
] }
# default-features disabled to drop native-tls/openssl-sys, which is unused on
# wasm (reqwest uses the browser fetch) and breaks host-target clippy.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "multipart"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned to the wasm-bindgen 0.2.121 family so the crate versions match the
# wasm-bindgen-cli that dx uses from nixpkgs (dx requires an exact match).
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "=0.4.71"
wasm-logger = "0.2"
web-sys = { version = "=0.3.98", features = [
  "Blob",
  "BlobPropertyBag",
  # Dropping the cached app shell before an update reload (src/update.rs), so the
  # service worker cannot answer it with the build being replaced.
  "Cache",
  "CacheStorage",
  "Clipboard",
  "ClipboardEvent",
  "CloseEvent",
  "CssStyleDeclaration",
  "DataTransfer",
  "Document",
  "CanvasRenderingContext2d",
  "Element",
  "ErrorEvent",
  "Event",
  "EventTarget",
  "History",
  "HtmlAnchorElement",
  "HtmlBrElement",
  "HtmlDocument",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlHeadElement",
  "HtmlImageElement",
  "HtmlSelectElement",
  "HtmlTextAreaElement",
  "Location",
  "MessageEvent",
  "Navigator",
  "Node",
  "NodeList",
  "Notification",
  "NotificationOptions",
  "NotificationPermission",
  "Performance",
  "PromiseRejectionEvent",
  "PushManager",
  "PushSubscription",
  "PushSubscriptionOptionsInit",
  "Range",
  "Selection",
  "ServiceWorkerContainer",
  "ServiceWorkerRegistration",
  "Storage",
  "Touch",
  "TouchEvent",
  "TouchList",
  "Url",
  "WebSocket",
  "WheelEvent",
  "Window",
  "XmlHttpRequest",
  "console",
] }

[features]
default = ["web"]
# Ship warn/error logs (with interaction breadcrumbs, user/session enrichment and
# panics) to Better Stack / Logtail. Reads BETTERSTACK_SOURCE_TOKEN at build time.
remote-logging = []
web = ["dioxus/router", "dioxus/web"]

# dx builds the web bundle with the `wasm-release` profile. Size matters (phones
# on venue wifi): fat LTO + a single codegen unit + abort-on-panic trim the wasm
# meaningfully on top of `opt-level = "s"` before gzip/brotli.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
# Keep DWARF line tables so a crash can be traced to a source line. They do NOT
# ship: scripts/split-symbols.nu moves them into a sidecar after the build, and
# the backend resolves reported offsets against it. Line tables only, since the
# full DWARF is ~26 MB and nothing here reads variables.
#
# It is not free even so — the bundle grows ~2% because wasm-opt optimises less
# aggressively when it has to keep the mapping valid. That buys readable stacks
# for every reported error, which the alternative (shipping the name section)
# could not do for a fifth of the cost.
debug = "line-tables-only"
strip = false
lto = "fat"
panic = "abort"
codegen-units = 1
