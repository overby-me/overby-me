[package]
name = "contacts-channel"
version = "0.1.0"
edition = "2021"
description = "Contacts channel for IronClaw AI assistant via CardDAV"
repository = "https://tangled.org/overby.me/overby.me/tree/main/ironclaw/contacts"
license = "MIT"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.36"

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1
