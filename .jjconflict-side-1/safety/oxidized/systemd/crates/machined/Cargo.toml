[package]
name = "systemd-machined"
version = "0.1.0"
authors = ["Niclas Overby <niclas@overby.me>"]
edition = "2024"

[[bin]]
name = "systemd-machined"
path = "src/main.rs"

[dependencies]
libc = "0.2"
log = "0.4"
nix = { version = "0.31", features = ["hostname", "process", "signal"] }
zbus = "5"

[dev-dependencies]
tempfile = "3"
