# size_hint() is a hint, explicitly allowed to be wrong; unsafe code that
# reserves from it and then ptr::writes per yielded item overflows when an
# iterator over-yields (RUSTSEC-2021-0003, SmallVec::insert_many). Safe uses
# of size_hint rarely share a function with an unsafe block, which is the
# whole discriminator.
id: rust-sizehint-in-unsafe
language: rust
severity: warning
message: >-
  This function trusts size_hint() near unsafe code. The contract allows any
  answer; write the loop so an over-yielding iterator cannot write past what
  was actually reserved.
files:
  - "**/*.rs"
ignores:
  - "apps/wiki/vendor/**"
  - "safety/oxidized/**"
rule:
  pattern: $I.size_hint()
  inside:
    kind: function_item
    stopBy: end
    has: {kind: unsafe_block, stopBy: end}
