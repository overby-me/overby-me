[workspace]
resolver = "2"
members = ["crates/agent", "crates/plugin"]

# Share common settings across workspace members
[workspace.package]
edition = "2024"
repository = "https://tangled.org/overby.me/overby.me/tree/main/nushell-plugin-tramp"
license = "MIT"

[workspace.dependencies]
# Async runtime (shared by plugin and agent)
tokio = { version = "1", features = ["full"] }

rmp-serde = "1.3"
rmpv = { version = "1.3", features = ["with-serde"] }
# Serialization (used by agent, and later by plugin's RPC client)
serde = { version = "1", features = ["derive"] }

# Error handling
thiserror = "2"

# Byte buffers
bytes = "1"

# Optimized release profile for the agent binary (minimal size ~1 MB)
[profile.release-agent]
inherits = "release"
opt-level = "z"
strip = true
lto = true
panic = "abort"
codegen-units = 1
