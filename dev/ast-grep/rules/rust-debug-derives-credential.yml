# Deriving Debug on a struct that holds a credential prints it: `{:?}` of an
# axum error, a clap Args, or a tracing span reaches the log with the secret in
# it. Serialize does the same over the wire.
#
# The field type has to be string-like. Matching the name alone reads
# `Poll { secret: bool }` as a credential, where "secret" is whether the poll
# is secret.
#
# "token" on its own is deliberately not in the list: apps/wiki's ballot crates
# use it for a protocol nullifier that is public by construction.
id: rust-debug-derives-credential
language: rust
severity: error
message: >-
  This derives Debug on a struct holding a credential, so any `{:?}` prints it -
  including error paths and log lines that never mention the field. Implement
  Debug by hand and redact it, or wrap the field in a type whose Debug is opaque.
files:
  - "**/*.rs"
ignores:
  - "apps/wiki/vendor/**"
  - "safety/oxidized/**"
rule:
  kind: struct_item
  all:
    - follows:
        kind: attribute_item
        regex: 'derive.*Debug'
    - has:
        stopBy: end
        kind: field_declaration
        all:
          - has:
              field: name
              regex: '^(access_token|refresh_token|id_token|bearer|api_key|apikey|secret|client_secret|password|passwd|private_key|passphrase|credential|session_key)'
          - has:
              field: type
              regex: 'String|str|Vec<u8>|\[u8'
