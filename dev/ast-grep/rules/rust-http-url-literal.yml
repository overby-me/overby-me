# A hardcoded http:// URL is a plaintext connection wherever it is fetched.
# The measured FP populations are excluded by construction: scheme-DETECTION
# code strips or tests the bare "http://" prefix (the regex requires a host
# character after the slashes), and test fixtures assert on made-up hosts
# (tests are globbed out). CodeQL's private-host exclusion list is folded in.
id: rust-http-url-literal
language: rust
severity: error
message: >-
  Hardcoded plaintext URL. Use https, or note why this endpoint cannot
  offer it.
files:
  - "**/*.rs"
ignores:
  - "apps/wiki/vendor/**"
  - "safety/oxidized/**"
  - "**/tests/**"
  - "**/*_test.rs"
  # Faithful transcriptions of other systems' screens (fake BSODs quote
  # real-looking URLs).
  - "apps/homepage/xscreensaver/**"
rule:
  kind: string_literal
  regex: '^"http://[a-z0-9]'
  all:
    - not:
        regex: 'localhost|127\.0\.0\.1|0\.0\.0\.0|192\.168\.|10\.|172\.(1[6-9]|2[0-9]|3[01])\.|\[::1\]|w3\.org|xmlns|schemas\.|example\.'
    - not:
        inside:
          kind: mod_item
          stopBy: end
          has: {field: name, regex: '^tests?$'}
