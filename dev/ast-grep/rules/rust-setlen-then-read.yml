# The set_len-before-init idiom behind ~25 RustSec memory-exposure advisories
# (RUSTSEC-2021-0138 among them): with_capacity + set_len fabricates
# initialised length, then the buffer is handed to a caller-supplied Read,
# which may read the uninit bytes or lie about how many it wrote. The FFI
# variant - C fills the buffer, THEN set_len - is fine and does not match,
# because there the set_len comes after the write, not before the read.
id: rust-setlen-then-read
language: rust
severity: error
message: >-
  set_len before read_exact hands uninitialised memory to a Read impl, which
  may observe it or under-fill it. Initialise with resize/vec-macro, or read
  into spare_capacity_mut and set_len after.
files:
  - "**/*.rs"
ignores:
  - "apps/wiki/vendor/**"
  - "safety/oxidized/**"
# Anchored on the statement: `follows` relates siblings, and the read_exact
# call is nested inside its statement, so the relation must hold between the
# two statements rather than the inner call nodes.
rule:
  kind: expression_statement
  has: {pattern: $R.read_exact(&mut $V), stopBy: end}
  follows:
    stopBy: end
    has: {pattern: $V.set_len($N), stopBy: end}
