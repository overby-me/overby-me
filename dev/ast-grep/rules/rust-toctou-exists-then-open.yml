# Check-then-act on the filesystem races against any concurrent writer, and
# the same-path identity is what makes the finding real: deslop's version
# matched ANY later open and drowned in noise; the metavariable reuse here is
# the fix. The inverted form - if !exists then create - is the benign
# create-if-missing idiom and does not match. Three sources converged on this
# shape independently (deslop-rust, deslop-python, deslop-go readers).
id: rust-toctou-exists-then-open
language: rust
severity: warning
message: >-
  This opens a path inside an if that checked exists() on the same path; the
  state can change between check and open. Open and handle NotFound instead -
  the open already reports it.
files:
  - "**/*.rs"
ignores:
  - "apps/wiki/vendor/**"
  - "safety/oxidized/**"
rule:
  any:
    - pattern: File::open($P)
    - pattern: fs::read_to_string($P)
    - pattern: fs::read($P)
    - pattern: std::fs::read_to_string($P)
  inside:
    kind: if_expression
    stopBy: end
    has:
      field: condition
      any:
        - pattern: $P.exists()
        - has: {pattern: $P.exists(), stopBy: end}
