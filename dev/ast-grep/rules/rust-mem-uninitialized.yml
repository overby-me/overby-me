# mem::uninitialized() is instant UB for most types and deprecated-always-
# wrong; the chained MaybeUninit::uninit().assume_init() is the same claim in
# one expression - no statement ever initialised the value
# (RUSTSEC-2018-0022, 2024-0018). The existing rust-unsafe-assume-init flags
# every assume_init for review; this narrower rule marks the two spellings
# that are wrong unconditionally.
id: rust-mem-uninitialized
language: rust
severity: warning
message: >-
  This conjures a value out of uninitialised memory - UB for any type with
  invalid bit patterns, and nothing initialised it in between. Use
  MaybeUninit and write before assume_init.
files:
  - "**/*.rs"
ignores:
  - "apps/wiki/vendor/**"
  - "safety/oxidized/**"
rule:
  any:
    - pattern: std::mem::uninitialized()
    - pattern: mem::uninitialized()
    - pattern: MaybeUninit::uninit().assume_init()
