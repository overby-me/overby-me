# A ratchet: zero findings today, because all eight destructors in this tree
# already guard. It exists to catch the ninth.
#
# `__del__` runs on every path out of a scope, including one where the
# constructor raised before the pointer was ever set. Freeing it unguarded is a
# free of whatever the field happens to hold. The convention here is
# `if self._ptr:` around the call, and this says so in a form that fails rather
# than in a comment nobody reads.
id: mojo-destructor-frees-unguarded
language: mojo
severity: warning
message: >-
  This destructor frees a pointer without checking it first. `__del__` also runs
  when the constructor raised partway through, so the field may never have been
  set. Guard the free with `if self._ptr:`.
rule:
  kind: function_definition
  all:
    - has:
        field: name
        regex: '^__del__$'
    - has:
        pattern: $FREE(self.$FIELD)
        stopBy: end
  not:
    has:
      kind: if_statement
      stopBy: end
constraints:
  FREE:
    regex: 'delete|free|destroy|release|drop'
