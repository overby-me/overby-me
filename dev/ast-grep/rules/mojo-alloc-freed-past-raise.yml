id: mojo-alloc-freed-past-raise
language: mojo
severity: warning
message: >-
  This buffer is freed on the success path only. The enclosing function is
  `raises`, so anything that throws between the alloc and this `.free()` leaks
  it. Move the free into a `finally:`.
rule:
  pattern: $BUF.free()
  inside:
    kind: function_definition
    stopBy: end
    all:
      - has:
          pattern: alloc[$T]($N)
          stopBy: end
      - regex: '\)\s*(->[^:]*)?\s*raises|raises\s*(->[^:]*)?:'
  not:
    inside:
      kind: finally_clause
      stopBy: end
