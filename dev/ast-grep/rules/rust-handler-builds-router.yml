# Ratchet: zero sites. Building a Router inside a handler re-registers every
# route per request; the router belongs in startup wiring. Same extractor
# heuristic as rust-handler-reads-env.
id: rust-handler-builds-router
language: rust
severity: error
message: >-
  This assembles a Router on the request path. Build it once at startup and
  share it.
files:
  - "**/*.rs"
ignores:
  - "apps/wiki/vendor/**"
  - "safety/oxidized/**"
rule:
  any:
    - pattern: Router::new($$$ARGS)
    - pattern: axum::Router::new($$$ARGS)
  inside:
    kind: function_item
    stopBy: end
    has:
      field: parameters
      has:
        stopBy: end
        kind: generic_type
        has:
          field: type
          regex: '^(State|Extension|Json|Path|Query)$'
