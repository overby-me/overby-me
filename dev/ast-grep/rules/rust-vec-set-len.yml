# Ratchet: zero sites.
#
# set_len tells Vec that elements exist without writing them, so reading or
# dropping them afterwards is UB. It is the one Vec method whose misuse is
# invisible at the call: the length is simply wrong from then on.
id: rust-vec-set-len
language: rust
severity: warning
message: >-
  set_len claims elements are initialised without writing them; reading or
  dropping them is UB. Write the elements first, or use resize / extend /
  spare_capacity_mut.
files:
  - "**/*.rs"
ignores:
  - "apps/wiki/vendor/**"
  - "safety/oxidized/**"
# The unsafe-context requirement is the receiver-type check ast-grep cannot
# do: Vec::set_len is an unsafe fn, File::set_len is safe - and the oxidized
# ports call File::set_len (truncate a file) 15 times, which the bare pattern
# wrongly matched.
rule:
  pattern: $VEC.set_len($$$ARGS)
  inside: {kind: unsafe_block, stopBy: end}
