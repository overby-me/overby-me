# Path::join with an absolute segment silently DISCARDS the base - the
# traversal-adjacent footgun. The one-character discriminator matters: the
# naive regex was wrong five out of five times on this tree because `.`
# matched the closing quote of "/", the slice-join separator idiom. The
# character class requires a real path character after the slash.
id: rust-join-absolute-literal
language: rust
severity: warning
message: >-
  join with an absolute path replaces the base entirely. If that is the
  intent, assign the absolute path directly; if not, strip the leading slash.
files:
  - "**/*.rs"
ignores:
  - "apps/wiki/vendor/**"
  - "safety/oxidized/**"
rule:
  pattern: $P.join($LIT)
  has:
    field: arguments
    has:
      kind: string_literal
      regex: '^"/[^"]'
