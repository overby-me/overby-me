# A panic that unwinds into a C caller is an instant process abort (it was UB
# before rustc made extern "C" abort-on-unwind). In a shim whose entire
# surface is called from Mojo, one unwrap in one entry point takes down the
# app with no Mojo frame in the trace (RUSTSEC-2019-0038 is the same shape).
# One live hit at introduction: mxr_render_dirty_panels in the XR shim.
id: rust-extern-c-fn-can-panic
language: rust
severity: error
message: >-
  This extern "C" fn can panic (unwrap/expect/panic!), and a panic across the
  C boundary aborts the process. Catch it with catch_unwind and return an
  error code.
files:
  - "**/*.rs"
ignores:
  - "apps/wiki/vendor/**"
  - "safety/oxidized/**"
rule:
  kind: function_item
  regex: 'extern "C"'
  all:
    - has:
        stopBy: end
        any:
          - pattern: $X.unwrap()
          - pattern: $X.expect($M)
          - pattern: panic!($$$A)
    - not:
        has:
          stopBy: end
          any:
            - pattern: catch_unwind($$$A)
            - pattern: std::panic::catch_unwind($$$A)
            - pattern: panic::catch_unwind($$$A)
