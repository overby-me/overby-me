# static mut invites aliased &mut - UB that rustc 2024's static_mut_refs
# catches at USE sites on new editions; the declaration itself still lands
# cleanly on older editions, which several workspaces here pin.
id: rust-static-mut
language: rust
severity: error
message: >-
  static mut allows aliased mutation, which is UB. Use an atomic, a
  Mutex/RwLock, or OnceLock - or document the single-threaded argument at an
  FFI-mandated static.
files:
  - "**/*.rs"
ignores:
  - "apps/wiki/vendor/**"
  - "safety/oxidized/**"
rule:
  kind: static_item
  regex: '^static mut '
