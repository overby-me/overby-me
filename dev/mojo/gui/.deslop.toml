# deslop configuration for mojo-gui, the Blitz-backed renderer shims that
# Mojo drives over a C ABI.
#
# Both shims exist to be called from Mojo through `extern "C"`, and the XR one
# additionally sits on OpenXR, Vulkan and wgpu. Raw pointers, C-layout structs
# and wire-width casts are the interface, not a lapse.

disabled_rules = [
  # The whole surface is `extern "C"` entry points taking raw pointers and
  # lengths from Mojo, plus OpenXR and Vulkan handles. Safety is argued for the
  # boundary as a whole in each file's header rather than per block, matching
  # the convention in the other Rust packages here.
  "unsafe_without_safety_comment",
  "rust_unsafe_raw_pointer_cast",
  "rust_unsafe_from_raw_parts",

  # The C ABI fixes its widths: node and panel ids cross as u32, string lengths
  # as usize, and the graphics APIs take u32 extents. Casting at the boundary is
  # what makes the signatures match.
  "rust_narrowing_numeric_cast",

  # Node id and handler maps keyed by ids this shim mints itself, per panel and
  # small; the DOM they mirror is a UI tree, not a hot path.
  "rust_hashmap_default_hasher",

  # `unwrap` on a `Mutex` this module is the only writer of, and on an OpenXR
  # enumeration that has already been length-checked.
  "unwrap_in_non_test_code",

  # The shim structs are filled as the session negotiates: a swapchain exists
  # only once the runtime hands one over, and the renderer only once a GPU is
  # picked. Both are `Option` until then rather than partially built.
  "rust_partial_init_escape",

  # Panel state tracks independent flags (dirty, focused, visible) that can hold
  # at once, so an enum would not model them.
  "rust_boolean_state_machine",

  # Fields read only under a cfg, or by the OpenXR path when a runtime is
  # present.
  "rust_broad_allow_dead_code",

  # The lib.rs of each shim is the C ABI surface, which is one file by
  # definition: splitting it would not reduce what a caller has to link
  # against.
  "rust_oversized_module_file",

  # `xr_session_begin_frame_and_get_panel_texture_view` and its neighbours are
  # named for the C symbols Mojo imports.
  "overlong_name",

  # Per-frame view matrix and vertex updates touch the same struct fields in a
  # loop because that is what a render loop does.
  "rust_aos_hot_path",

  # FALSE POSITIVE. The flagged site is the OpenXR runtime name, decoded once
  # at session setup.
  "rust_utf8_validate_hot_path",
]
