# A credential-named identifier interpolated into a LOG macro lands the value
# in log storage. format!/panic! are deliberately NOT in the macro list: the
# measured hits there were auth-HEADER construction ("DPoP {token}"), where
# emitting the credential is the purpose. `token` and `key` are deliberately
# NOT in the name list: this tree uses both pervasively for lexer tokens and
# map keys, and CodeQL independently dropped "key" for the same reason.
id: rust-secret-in-log-macro
language: rust
severity: error
message: >-
  This logs a credential-named value. Redact it, or rename the variable if it
  is not actually a secret.
files:
  - "**/*.rs"
ignores:
  - "apps/wiki/vendor/**"
  - "safety/oxidized/**"
# Two branches: a bare identifier argument, and the inline `{name}` capture
# inside the format string, which is part of the string literal rather than
# an identifier node.
rule:
  any:
    - kind: identifier
      regex: '^(password|passwd|api_key|client_secret|private_key|passphrase|access_token|refresh_token|credential)$'
    - kind: string_literal
      regex: '\{(password|passwd|api_key|client_secret|private_key|passphrase|access_token|refresh_token|credential)[}:]'
  inside:
    kind: token_tree
    stopBy: end
    inside:
      kind: macro_invocation
      regex: '^(log::)?(tracing::)?(info|debug|warn|error|trace|println|eprintln)!'
