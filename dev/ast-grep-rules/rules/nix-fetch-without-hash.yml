# A fetch with no hash is impure and unpinned: the build result changes when
# the remote does, and pure evaluation refuses it outright. Zero uses today;
# the flake inputs are where remote sources belong.
id: nix-fetch-without-hash
language: nix
severity: error
message: >-
  This fetch has no content hash, so it is unpinned and fails pure
  evaluation. Add sha256/hash, or make it a flake input.
rule:
  any:
    - pattern: builtins.fetchTarball $ARG
    - pattern: builtins.fetchurl $ARG
    - pattern: fetchTarball $ARG
  not:
    has: {regex: 'sha256|narHash|hash', stopBy: end}
