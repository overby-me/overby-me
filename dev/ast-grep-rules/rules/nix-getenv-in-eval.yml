# builtins.getEnv silently returns "" under pure flake evaluation - the
# correctness trap is that the code keeps working with an empty value rather
# than failing. Zero uses in the tree today; statix has no rule for it.
id: nix-getenv-in-eval
language: nix
severity: error
message: >-
  getEnv returns "" under pure evaluation, so this reads as the empty string
  in any flake build. Pass the value through the flake's inputs or module
  options instead.
rule:
  pattern: builtins.getEnv $X
