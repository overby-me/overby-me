# Ratchet: zero sites, with axum in 24 files.
#
# Reading configuration inside a handler makes a syscall and a parse on every
# request, and makes the value silently depend on the environment of whichever
# thread served it. Read it at startup and put it in state.
#
# "Handler" is approximated by an axum extractor in the parameter list, which is
# what makes the rule narrow enough to be useful: the tree has 599 env::var call
# sites and all but the handler-shaped ones are startup or CLI code.
#
# The extractor must be a generic_type. Matching the bare name instead reads
# `fn build_path(nix_env: Option<&Path>)` as a handler, because axum's Path
# extractor and std::path::Path share a name; the extractor is always Path<T>.
id: rust-handler-reads-env
language: rust
severity: error
message: >-
  This reads the environment on the request path. Read it once at startup and
  pass it through state.
files:
  - "**/*.rs"
ignores:
  - "apps/wiki/vendor/**"
  - "safety/oxidized/**"
rule:
  any:
    - pattern: std::env::var($$$ARGS)
    - pattern: env::var($$$ARGS)
  inside:
    kind: function_item
    stopBy: end
    has:
      field: parameters
      has:
        stopBy: end
        kind: generic_type
        has:
          field: type
          regex: '^(State|Extension|Json|Path|Query)$'
