# deslop configuration for tangled-cli
#
# This tree is a vendored fork of an upstream CLI (vitorpy.com/tangled-cli).
# Its shape is dictated by two things we do not control: the AT Protocol XRPC
# wire format, and upstream's error-handling style. Rewriting either to satisfy
# a lint would make every future rebase onto upstream painful for no gain, so
# the rules that fire on those inherent patterns are disabled below. Rules that
# would catch a real defect we introduce are left on.

disabled_rules = [
  # ── Application-edge error handling ───────────────────────────────────
  # Every public function in tangled-api returns anyhow::Result, because the
  # only consumer is the CLI binary, which prints the error and exits. A typed
  # error enum per XRPC endpoint would be ~60 variants with one call site each.
  "rust_public_anyhow_result",

  # ── AT Protocol wire types ────────────────────────────────────────────
  # XRPC request/response structs carry access JWTs, refresh JWTs, service-auth
  # tokens, app passwords, and repo secrets *by protocol*. They have to
  # serialize and deserialize; that is what they are for. The name-based
  # heuristic fires on every one of them.
  "rust_serde_sensitive_serialize",
  "rust_serde_sensitive_deserialize",
  "rust_debug_secret",

  # Lexicon records are open by design: a server may add fields at any time and
  # older clients must keep working. deny_unknown_fields would turn every
  # upstream lexicon addition into a hard client failure.
  "rust_serde_unknown_fields_allowed",

  # Records evolve. A field that is required today was absent yesterday (see
  # sh.tangled.repo `name`), so #[serde(default)] on a nominally required field
  # is the compatibility mechanism, not an oversight.
  "rust_serde_default_on_required_field",

  # Repository derives Default so callers can build one field-by-field before
  # a create call; the "invalid state" it flags is the pre-populated struct.
  "rust_domain_default_produces_invalid",
  "rust_domain_optional_secret_default",

  # ── Network client shape ──────────────────────────────────────────────
  # Every method is one HTTP round-trip: build params, await, deserialize. The
  # duplicate-bootstrap and large-future heuristics fire on that repetition,
  # which is the point of a thin API wrapper.
  "rust_duplicate_bootstrap_sequence",
  "rust_large_future_stack",
  "rust_async_hold_permit_across_await",

  # reqwest hands back a String body; response sizes are bounded by the XRPC
  # endpoints themselves, not by us.
  "rust_unbounded_read_to_string",
  "rust_utf8_validate_hot_path",

  # git2 and keyring are blocking C libraries with no async equivalent. Their
  # calls sit inside async fns because the surrounding command is async.
  "rust_blocking_io_in_async",

  # ── Low-signal heuristics on this codebase ────────────────────────────
  # Comparing a repo name, key name, or branch name with == is string handling,
  # not a credential comparison.
  "rust_secret_equality_compare",

  # Lexicon fields that are open string unions upstream (status, state, kind)
  # stay String here so an unknown value round-trips instead of failing.
  "rust_stringly_typed_enum_boundary",
  "rust_domain_raw_primitive",

  # lib.rs re-exports the client surface deliberately: it is the crate's API.
  "rust_root_reexport_wall",

  # CreateRepoOptions mirrors the optional fields of the create endpoint.
  "rust_option_bag_config",
  "rust_public_bool_parameter_api",
  "rust_partial_init_escape",

  # Default hasher is fine for the handful of maps a CLI builds.
  "rust_hashmap_default_hasher",

  # Config discovery stats a path before opening it; the TOCTOU window is not
  # meaningful for a user-owned config file.
  "rust_check_then_open_path",

  # Exit codes are narrowed to i32 to match the process interface.
  "rust_narrowing_numeric_cast",
]
