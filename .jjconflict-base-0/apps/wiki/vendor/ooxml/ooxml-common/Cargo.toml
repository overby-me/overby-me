[package]
name = "ooxml-common"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate-miniz"] }

[dev-dependencies]
serde_json = "1"
