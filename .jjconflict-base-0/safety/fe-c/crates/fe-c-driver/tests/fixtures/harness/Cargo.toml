[package]
name = "fec-harness"
version = "0.0.0"
edition = "2021"
publish = false

# B2 instrumentation harness. Its own workspace (not a member of the Fe-C
# workspace) so building it with the instrument driver stays isolated. The
# `fe-c-instrument` check compiles this with FEC_INSTRUMENT=1 and asserts
# the injected cementite checks fire at runtime.
[workspace]

[[bin]]
name = "fec-harness"
path = "src/main.rs"

[dependencies]
cementite = { path = "../../../../cementite" }
