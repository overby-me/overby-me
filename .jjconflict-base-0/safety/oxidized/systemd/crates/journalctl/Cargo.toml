[package]
name = "journalctl"
version = "0.1.0"
authors = ["Niclas Overby <niclas@overby.me>"]
edition = "2024"

[[bin]]
name = "journalctl"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
glob = "0.3"
libc = "0.2"
libsystemd = { path = "../libsystemd" }
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
