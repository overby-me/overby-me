# The C-heritage bug the existing Mojo rules do not cover: leak-on-raise and
# unguarded-destructor-free are shipped, but freeing the SAME pointer twice
# corrupts the allocator and nothing at the Mojo layer stops it. Metavariable
# unification across the follows relation is the same-pointer check. Blind
# spot, recorded: a reassignment of $P between the frees is invisible.
id: mojo-double-free
language: mojo
severity: warning
message: >-
  This pointer was already freed above; freeing it again corrupts the
  allocator. If ownership moved, null the old binding or restructure so one
  owner frees.
# In this grammar bare calls are direct block children (there is no
# expression_statement node), so the two frees are already siblings and the
# follows relation applies to the calls themselves.
rule:
  pattern: $P.free()
  follows:
    stopBy: end
    pattern: $P.free()
