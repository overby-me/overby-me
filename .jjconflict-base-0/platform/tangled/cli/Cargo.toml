[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"

[workspace.dependencies]
# AT Protocol
atrium-api = { version = "0.25", features = ["agent"] }
atrium-common = "0.1"
atrium-identity = "0.1"
atrium-oauth = "0.1"
atrium-xrpc = "0.12"
atrium-xrpc-client = "0.5"

# CLI
clap = { version = "4.5", features = ["derive", "env", "unicode", "wrap_help"] }
clap_complete = "4.5"
clap_complete_nushell = "4.5"
clap_mangen = "0.2"

futures = "0.3"
# Async
tokio = { version = "1.40", features = ["full"] }

# HTTP & Serialization
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Git
git2 = "0.19"
git2-credentials = "0.13"

colored = "2.1"
console = "0.15"
dialoguer = "0.11"
# Terminal UI
indicatif = "0.17"
tabled = "0.16"

# Storage
dirs = "5.0"
keyring = { version = "3.6", features = ["sync-secret-service", "vendored"] }

# Error Handling
anyhow = "1.0"
thiserror = "2.0"

base64 = "0.22"
# Utilities
chrono = { version = "0.4", features = ["serde"] }
open = "5"
regex = "1.10"
url = "2.5"

ciborium = "0.2"
futures-util = "0.3"
# WebSocket
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }

assert_cmd = "2.0"
# Testing
mockito = "1.4"
predicates = "3.1"
tempfile = "3.10"
